<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WarmPath · Engineering pad prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Recursive:slnt,wght,CASL,CRSV,MONO@-15..0,300..1000,0..1,0..1,0..1&display=swap" rel="stylesheet">
<style>
  :root {
    --u: 24px;                               /* one grid square; everything sits on it */
    --paper: #e9f0dc;
    --grid: rgba(47, 107, 60, 0.15);
    --grid-heavy: rgba(47, 107, 60, 0.3);
    --print: #2f6b3c;                        /* what the pad came printed with */
    --graphite: #232a25;                     /* what the student wrote */
    --graphite-soft: #535d56;
    --marker: #ffe53b;                       /* highlighter: you have this */
    --red: #b3291a;                          /* red pencil: next, accepted */
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  }
  * { box-sizing: border-box; }
  html { background: var(--paper); }
  body {
    margin: 0; min-height: 100vh;
    color: var(--graphite);
    font-family: 'Recursive', ui-sans-serif, system-ui, sans-serif;
    font-variation-settings: 'MONO' 0, 'CASL' 0, 'CRSV' 0.5;
    font-size: 16px; line-height: var(--u);
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid-heavy) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-heavy) 1px, transparent 1px),
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: calc(var(--u) * 5) calc(var(--u) * 5), calc(var(--u) * 5) calc(var(--u) * 5), var(--u) var(--u), var(--u) var(--u);
    background-position: -1px -1px;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--marker); color: var(--graphite); }
  button, input, textarea { font: inherit; font-variation-settings: inherit; color: inherit; letter-spacing: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }

  /* three voices from one family */
  .cap { font-size: 11px; font-weight: 650; letter-spacing: 0.11em; text-transform: uppercase; color: var(--print); }
  .hand { font-variation-settings: 'MONO' 0, 'CASL' 1, 'CRSV' 1; }
  .fig { font-variation-settings: 'MONO' 1, 'CASL' 0.4, 'CRSV' 0; font-variant-numeric: tabular-nums; }
  .soft { color: var(--graphite-soft); }

  .sheet { width: min(1176px, 100% - 96px); margin: 0 auto; padding: var(--u) 0 calc(var(--u) * 3); }

  /* ---------- printed header strip ---------- */
  .head { display: grid; grid-template-columns: 216px minmax(0, 1fr) auto 120px; height: calc(var(--u) * 3); border: 2px solid var(--print); background: var(--paper); }
  .head > * { display: flex; flex-direction: column; justify-content: center; padding: 0 18px; min-width: 0; }
  .head > * + * { border-left: 2px solid var(--print); }
  .head strong { font-size: 22px; font-weight: 800; line-height: 1.1; letter-spacing: -0.01em; background: none; border: 0; padding: 0; text-align: left; }
  .head .entry { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .switch { display: flex; gap: 6px; margin-top: 2px; }
  .switch button { padding: 1px 10px; border: 1.5px solid transparent; border-radius: 4px; background: none; font-weight: 600; white-space: nowrap; }
  .switch button[aria-pressed='true'] { border-color: var(--graphite); background: var(--marker); }
  .switch button:active { transform: scale(0.97); }

  /* ---------- margin rule and parts ---------- */
  .part { display: grid; grid-template-columns: calc(var(--u) * 6) minmax(0, 1fr); margin-top: var(--u); }
  .part > h2 {
    margin: 0; padding-right: 18px; text-align: right;
    font-size: 15px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; line-height: var(--u);
    font-variation-settings: 'MONO' 0, 'CASL' 1, 'CRSV' 1;
  }
  .part > div { padding-left: var(--u); border-left: 2px solid var(--print); box-shadow: inset 4px 0 0 var(--paper), inset 6px 0 0 var(--print); min-width: 0; }
  .part p { margin: 0; max-width: 72ch; }
  [data-solved='false'] .solved { display: none; }
  .solved { animation: appear 220ms ease both; }
  @keyframes appear { from { opacity: 0; } }

  /* ---------- given ---------- */
  .goalrow { display: flex; align-items: flex-end; gap: var(--u); }
  .goalrow label { flex: none; width: calc(var(--u) * 2); padding-bottom: 7px; }
  .goalrow input {
    flex: 1; min-width: 0; height: calc(var(--u) * 2); padding: 0;
    border: 0; border-bottom: 2px solid var(--graphite); border-radius: 0; background: none;
    font-size: 36px; font-weight: 600; letter-spacing: -0.02em;
    caret-color: var(--red);
  }
  .goalrow input::placeholder { color: var(--graphite-soft); opacity: 1; font-weight: 400; }
  .goalrow input:focus { outline: 0; border-bottom-color: var(--red); }
  .btn {
    flex: none; height: calc(var(--u) * 2 - 6px); padding: 0 22px;
    border: 2px solid var(--graphite); border-radius: 4px; background: var(--paper);
    font-weight: 750;
    transition: transform 120ms var(--ease-out), background-color 120ms ease;
  }
  .btn:active { transform: scale(0.97); }
  @media (hover: hover) and (pointer: fine) { .btn:hover { background: var(--marker); } }
  .btn.small { height: calc(var(--u) + 8px); padding: 0 14px; font-size: 15px; }
  .btn.ink { background: var(--graphite); color: var(--paper); }
  @media (hover: hover) and (pointer: fine) { .btn.ink:hover { background: #000; } }
  .line { display: grid; grid-template-columns: calc(var(--u) * 2) minmax(0, 1fr); gap: var(--u); margin-top: var(--u); }
  mark { color: inherit; background: linear-gradient(var(--marker), var(--marker)) no-repeat 0 60% / 100% 78%; padding: 0 3px; margin: 0 -3px; }

  /* ---------- plot ---------- */
  .plot { display: block; width: 100%; height: auto; max-width: 1000px; margin-top: calc(var(--u) / 2); overflow: visible; }
  .plot text { font-family: 'Recursive', sans-serif; fill: var(--graphite); }
  .plot .axis { stroke: var(--graphite); stroke-width: 1.6; fill: none; }
  .plot .tick { font-size: 12px; font-variation-settings: 'MONO' 1, 'CASL' 0.4; fill: var(--graphite-soft); }
  .plot .printed { font-size: 10.5px; font-weight: 650; letter-spacing: 0.11em; fill: var(--print); }
  .plot .bubble { cursor: pointer; outline: none; }
  .plot .bubble circle.c { fill: var(--paper); stroke: var(--graphite); stroke-width: 1.8; transition: fill 200ms ease; }
  .plot .bubble.have circle.c { fill: var(--marker); }
  .plot .bubble circle.ring { fill: none; stroke: var(--red); stroke-width: 1.8; opacity: 0; }
  .plot .bubble.next circle.ring { opacity: 1; }
  .plot .bubble.on circle.c { stroke-width: 3.4; }
  .plot .bubble:focus-visible circle.c { stroke: var(--red); stroke-width: 3.4; }
  .plot .bubble .n { font-size: 15px; font-weight: 650; font-variation-settings: 'MONO' 0, 'CASL' 1, 'CRSV' 1; }
  .plot .bubble .k { font-size: 12.5px; font-variation-settings: 'MONO' 1, 'CASL' 0.4; fill: var(--graphite-soft); }
  .plot .red { stroke: var(--red); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .plot .redtext { fill: var(--red); font-size: 14px; font-weight: 650; font-variation-settings: 'MONO' 0, 'CASL' 1, 'CRSV' 1; }

  /* ---------- worked table ---------- */
  .work { margin-top: var(--u); }
  .work .cols, .work button.r {
    display: grid; grid-template-columns: minmax(0, 1fr) 250px 136px 68px 124px; column-gap: var(--u); align-items: center;
    width: 100%; text-align: left;
  }
  .work .cols { height: var(--u); border-bottom: 2px solid var(--print); }
  .work button.r { height: calc(var(--u) * 2); padding: 0; border: 0; border-bottom: 1px solid var(--graphite-soft); background: none; }
  .work button.r[aria-pressed='true'] .nm { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 5px; }
  @media (hover: hover) and (pointer: fine) { .work button.r:hover .nm { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 5px; } }
  .work .nm { font-size: 18px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .work .nm small { margin-left: 10px; font-size: 13px; font-weight: 500; color: var(--graphite-soft); font-variation-settings: 'MONO' 0, 'CASL' 0; }
  .units { display: flex; align-items: center; gap: 3px; }
  .units i { width: 11px; height: 11px; border: 1.5px solid var(--graphite); }
  .units i.f { background: var(--graphite); }
  .units b { margin-left: 9px; font-weight: 600; }
  .lift { font-size: 21px; font-weight: 800; }
  .state { justify-self: start; font-weight: 650; }
  .state.next { padding: 0 8px; border: 2px solid var(--red); color: var(--red); line-height: 22px; }

  .answer { display: inline-grid; gap: 2px; margin-top: var(--u); padding: 12px 20px 14px; border: 2px solid var(--graphite); outline: 2px solid var(--graphite); outline-offset: 3px; background: var(--paper); }
  .answer strong { font-size: 24px; font-weight: 800; line-height: 1.25; letter-spacing: -0.01em; }

  /* ---------- ask ---------- */
  .askhead { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .askhead button { border: 0; background: none; padding: 0; text-decoration: underline; text-underline-offset: 4px; color: var(--graphite-soft); }
  .person { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: var(--u); align-items: start; padding: 11px 0 12px; border-bottom: 1px solid var(--graphite-soft); }
  .person h3 { margin: 0; font-size: 18px; font-weight: 700; line-height: var(--u); }
  .person h3 small { margin-left: 10px; font-size: 13px; font-weight: 500; color: var(--graphite-soft); }
  .person p { max-width: 60ch; }
  .compose { grid-column: 1 / -1; display: grid; grid-template-rows: 0fr; transition: grid-template-rows 200ms var(--ease-out); }
  .compose[data-open='true'] { grid-template-rows: 1fr; }
  .compose > div { overflow: hidden; }
  .compose textarea {
    display: block; width: 100%; height: calc(var(--u) * 6); margin-top: 12px; padding: 0 12px;
    border: 2px solid var(--graphite); border-radius: 0; resize: vertical;
    line-height: var(--u);
    background: repeating-linear-gradient(transparent 0 calc(var(--u) - 1px), var(--grid-heavy) calc(var(--u) - 1px) var(--u)) var(--paper);
    caret-color: var(--red);
  }
  .compose textarea:focus { outline: 0; border-color: var(--red); }
  .compose .acts { display: flex; justify-content: flex-end; gap: 12px; padding: 12px 0 2px; }
  .status { font-weight: 650; white-space: nowrap; }
  .status a { margin-left: 10px; color: inherit; text-underline-offset: 4px; }
  .status.ok { color: var(--red); }
  .tickmark { width: 18px; height: 18px; vertical-align: -3px; margin-right: 6px; stroke: var(--red); stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }

  .week { margin: 0; padding: 0; list-style: none; }
  .week li { display: grid; grid-template-columns: 72px minmax(0, 1.1fr) minmax(0, 2fr); column-gap: var(--u); height: var(--u); white-space: nowrap; }
  .week li > * { overflow: hidden; text-overflow: ellipsis; }

  .part .fine { margin-top: var(--u); }

  /* ---------- alum reply ---------- */
  .slip { width: min(432px, 100% - 36px); margin: 0 auto; padding: var(--u) 0 calc(var(--u) * 2); }
  .slip .head { grid-template-columns: 1fr auto; height: auto; }
  .slip .head > * { padding: 9px 14px 11px; }
  .memo { margin-top: var(--u); border: 2px solid var(--print); border-bottom: 0; background: var(--paper); }
  .memo div { display: grid; grid-template-columns: 60px minmax(0, 1fr); gap: 12px; padding: 5px 14px 6px; border-bottom: 2px solid var(--print); align-items: baseline; }
  .memo b { font-weight: 700; }
  .slip h1 { margin: var(--u) 0 12px; font-size: 30px; font-weight: 800; line-height: 1.15; letter-spacing: -0.02em; text-wrap: balance; }
  .slip h2 { margin: var(--u) 0 0; line-height: var(--u); }
  .slip .msg { margin: 0; padding: 0 2px; background: repeating-linear-gradient(transparent 0 calc(var(--u) - 1px), var(--graphite-soft) calc(var(--u) - 1px) var(--u)); }
  .slip .btn { width: 100%; height: calc(var(--u) * 3); margin-top: var(--u); font-size: 19px; }
  .slip .done { display: flex; align-items: center; justify-content: center; gap: 6px; height: calc(var(--u) * 3); margin-top: var(--u); border: 2px solid var(--red); color: var(--red); font-size: 19px; font-weight: 800; animation: appear 200ms ease both; }
  .slip .done .tickmark { width: 26px; height: 26px; }
  .slip .after { margin-top: 12px; text-align: center; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: 0ms !important; }
  }
</style>
<script src="../shared/fake-api.js"></script>
</head>
<body data-solved="false">
<div id="app"></div>

<script>
(function () {
  'use strict'
  var api = window.WarmPathFake
  var app = document.getElementById('app')
  var esc = function (text) { return String(text).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c] }) }
  var TICK = '<svg class="tickmark" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 10l4 4 8-11"/></svg>'

  var state = { studentId: 1, solved: false, goal: '', selected: null, composing: null }
  var students = api.getStudents()

  // ---- plot geometry: x is the year a stop usually happens, y is its lift ----
  var YEAR_X = { 1: 190, 2: 400, 3: 610, 4: 820 }
  var liftY = function (lift) { return 262 - ((lift - 1.5) / 3) * 214 }
  var radius = function (stop) { return 5 + stop.achievers * 1.5 }

  function plot(path) {
    var student = path.student, next = path.stops.filter(function (s) { return s.next })[0]
    var youX = YEAR_X[student.school_year]
    var svg = '<svg class="plot" viewBox="0 0 1000 326" role="group" aria-label="Stops by year and lift">' +
      '<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l8 4-8 4" class="red"/></marker></defs>' +
      '<path class="axis" d="M84 34V262H912M905 256l8 6-8 6"/>' +
      '<text class="printed" x="84" y="22" text-anchor="middle">LIFT</text>' +
      [2, 3, 4].map(function (l) { return '<path class="axis" d="M78 ' + liftY(l) + 'h6"/><text class="tick" x="70" y="' + (liftY(l) + 4) + '" text-anchor="end">' + l + '×</text>' }).join('') +
      '<text class="tick" x="70" y="266" text-anchor="end">1.5×</text>' +
      Object.keys(YEAR_X).map(function (y) { return '<path class="axis" d="M' + YEAR_X[y] + ' 262v6"/><text class="printed" x="' + YEAR_X[y] + '" y="284" text-anchor="middle">YEAR ' + y + '</text>' }).join('') +
      '<circle class="axis" cx="948" cy="262" r="13"/><circle class="axis" cx="948" cy="262" r="6.5"/>' +
      '<text class="n" x="948" y="222" text-anchor="middle" style="font-size:15px;font-weight:700;font-variation-settings:\'CASL\' 1">Goal</text>' +
      '<text class="tick" x="948" y="239" text-anchor="middle">' + path.goal.achievers + ' got here</text>'

    path.stops.forEach(function (stop) {
      var x = YEAR_X[stop.typical_year], y = liftY(stop.lift), r = radius(stop)
      svg += '<g class="bubble' + (stop.have ? ' have' : '') + (stop.next ? ' next' : '') + (state.selected === stop.activity_id ? ' on' : '') + '" data-id="' + stop.activity_id + '" tabindex="0" role="button" ' +
        'aria-label="' + esc(stop.name) + ', ' + stop.achievers + ' of ' + path.goal.achievers + ' did this, lift ' + stop.lift + '. Show the alumni.">' +
        '<circle class="ring" cx="' + x + '" cy="' + y + '" r="' + (r + 5) + '"/><circle class="c" cx="' + x + '" cy="' + y + '" r="' + r + '"/>' +
        '<text class="n" x="' + (x + r + 11) + '" y="' + (y - 1) + '">' + esc(stop.name) + '</text>' +
        '<text class="k" x="' + (x + r + 11) + '" y="' + (y + 15) + '">' + stop.achievers + '/' + path.goal.achievers + ' · ' + stop.lift.toFixed(1) + '×</text></g>'
    })

    // Red pencil: where you are on the year axis, and one arrow to the next stop.
    svg += '<path class="red" d="M' + youX + ' 296l-7 12h14z"/><text class="redtext" x="' + youX + '" y="324" text-anchor="middle">you are here</text>'
    if (next) {
      var nx = YEAR_X[next.typical_year], ny = liftY(next.lift), nr = radius(next) + 9
      var ang = Math.atan2(ny - 292, nx - youX)
      var ex = nx - Math.cos(ang) * nr, ey = ny - Math.sin(ang) * nr
      var crowded = path.stops.some(function (s) { return s !== next && s.typical_year === next.typical_year && s.lift < next.lift })
      var cx = crowded ? youX + (ex - youX) * 0.2 : youX + (ex - youX) * 0.92
      var cy = crowded ? ey + (292 - ey) * 0.25 : 292 - (292 - ey) * 0.12
      svg += '<path class="red" marker-end="url(#ah)" d="M' + youX + ' 292Q' + cx + ' ' + cy + ' ' + ex + ' ' + ey + '"/>'
    }
    return svg + '</svg>'
  }

  function units(count, total) {
    var out = ''
    for (var i = 0; i < total; i++) out += '<i' + (i < count ? ' class="f"' : '') + '></i>'
    return '<span class="units" aria-hidden="true">' + out + '</span>'
  }

  function table(path) {
    return '<div class="work"><div class="cols cap"><span>Stop</span><span>Of the ' + path.goal.achievers + ' who got there</span><span>Of all ' + api.ALUMNI_TOTAL + ' alumni</span><span>Lift</span><span></span></div>' +
      path.stops.map(function (stop) {
        var base = api.baseRate(stop)
        return '<button class="r" data-id="' + stop.activity_id + '" aria-pressed="' + (state.selected === stop.activity_id) + '">' +
          '<span class="nm hand">' + (stop.have ? '<mark>' + esc(stop.name) + '</mark>' : esc(stop.name)) + '<small>' + api.TYPE_LABEL[stop.type] + '</small></span>' +
          '<span class="units">' + units(stop.achievers, path.goal.achievers) + '<b class="fig">' + stop.achievers + '/' + path.goal.achievers + '</b></span>' +
          '<span class="fig soft" style="white-space:nowrap">≈' + base.count + '/' + base.total + ' · ' + Math.round(base.share * 100) + '%</span>' +
          '<span class="lift fig">' + stop.lift.toFixed(1) + '×</span>' +
          (stop.next ? '<span class="state next hand">next</span>' : stop.have ? '<span class="state hand soft">you have this</span>' : '<span></span>') +
          '</button>'
      }).join('') + '</div>'
  }

  function answer(path) {
    var next = path.stops.filter(function (s) { return s.next })[0]
    if (!next) return ''
    var day = next.event && api.eventDay(next.event.starts_at)
    return '<div class="answer"><span class="cap">Highest-lift stop you do not have yet</span><strong class="hand">' + esc(next.name) + '</strong>' +
      (day ? '<span>' + esc(next.event.title) + ', ' + day.weekdayLong + ' ' + day.month + ' ' + day.day + ', ' + day.time + ', ' + esc(next.event.location) + '</span>' : '') + '</div>'
  }

  function people(path) {
    var stop = path.stops.filter(function (s) { return s.activity_id === state.selected })[0]
    var list = api.getPeople({ goal_id: path.goal.id, student_id: state.studentId, activity_id: stop ? stop.activity_id : undefined })
    var asks = api.asksByAlum(state.studentId)
    var total = stop ? stop.achievers : path.goal.achievers
    var shown = list.slice(0, 3)
    return '<p class="askhead"><span>The ' + shown.length + ' closest starts to yours, of the ' + total + ' who ' +
      (stop ? 'went through <b class="hand">' + esc(stop.name) + '</b>' : 'reached the goal') + '.</span>' +
      (stop ? '<button data-all>Show all ' + path.goal.achievers + '</button>' : '<span class="soft">Pick a stop above to narrow this.</span>') + '</p>' +
      shown.map(function (person) {
        var ask = asks[person.id], first = person.name.split(' ')[0], composing = state.composing === person.id && !ask
        var right = ask
          ? (ask.status === 'accepted'
              ? '<span class="status ok hand">' + TICK + 'Accepted a 15-minute call</span>'
              : '<span class="status hand">Sent, waiting<a href="#/reply/' + ask.id + '" target="_blank" rel="noreferrer">open reply page</a></span>')
          : (composing ? '<span></span>' : '<button class="btn small" data-ask="' + person.id + '">Ask ' + esc(first) + '</button>')
        return '<article class="person"><div><h3 class="hand">' + esc(person.name) + '<small>' + person.major + ' ’' + String(person.grad_year).slice(2) + '</small></h3><p>' + esc(person.shared_tie) + '</p></div>' + right +
          '<div class="compose" data-open="' + composing + '"><div><textarea class="hand" data-draft="' + person.id + '" aria-label="Message to ' + esc(person.name) + '"' + (composing ? '' : ' tabindex="-1"') + '>' + esc(person.draft) + '</textarea>' +
          '<div class="acts"><button class="btn small" data-cancel' + (composing ? '' : ' tabindex="-1"') + '>Cancel</button><button class="btn small ink" data-send="' + person.id + '"' + (composing ? '' : ' tabindex="-1"') + '>Send the ask</button></div></div></div></article>'
      }).join('')
  }

  function week(path) {
    return '<ul class="week">' + path.events.slice(0, 4).map(function (event) {
      var day = api.eventDay(event.starts_at)
      var stop = path.stops.filter(function (s) { return s.activity_id === event.activity_id })[0]
      return '<li><b class="fig">' + day.weekday + ' ' + day.day + '</b><span class="hand">' + esc(event.title) + '</span><span class="soft">' + esc(stop.name) + ' · ' + day.time + ' · ' + esc(event.location) + '</span></li>'
    }).join('') + '</ul>'
  }

  function header() {
    return '<header class="head"><button class="hand" id="home" style="border:0;background:none;text-align:left;align-items:flex-start"><span class="cap">Pad</span><strong>WarmPath</strong></button>' +
      '<div><span class="cap">Problem</span><span class="entry hand">Path to a goal, worked from ' + api.ALUMNI_TOTAL + ' alumni records</span></div>' +
      '<div><span class="cap">Student</span><div class="switch hand" role="group" aria-label="Student profile">' + students.map(function (s) {
        return '<button data-student="' + s.id + '" aria-pressed="' + (s.id === state.studentId) + '">' + s.major + ', ' + api.ordinal(s.school_year) + ' year</button>'
      }).join('') + '</div></div>' +
      '<div><span class="cap">Data</span><span class="entry fig">seeded</span></div></header>'
  }

  function render() {
    var reply = location.hash.match(/^#\/reply\/(\d+)/)
    if (reply) return renderReply(reply[1])
    var path = api.postPath({ goal: state.goal, student_id: state.studentId })
    var have = path.stops.filter(function (s) { return s.have }).map(function (s) { return '<mark class="hand">' + esc(s.name) + '</mark>' })
    var keepFocus = document.activeElement && document.activeElement.id === 'goal'
    document.body.dataset.solved = String(state.solved)

    app.innerHTML = '<div class="sheet">' + header() +
      '<section class="part"><h2>Given</h2><div>' +
        '<form class="goalrow" id="goalForm"><label class="cap" for="goal">Goal</label>' +
        '<input class="hand" id="goal" autocomplete="off" spellcheck="false" placeholder="' + esc(api.SEEDED_GOALS[0]) + '" value="' + esc(state.goal) + '">' +
        '<button class="btn">' + (state.solved ? 'Solve again' : 'Solve') + '</button></form>' +
        '<div class="line"><span class="cap">You</span><p><span class="hand">' + esc(path.student.name) + '</span>, ' + path.student.major + ', ' + api.ordinal(path.student.school_year) + ' year. ' +
          (have.length ? 'Already have ' + have.join(' and ') + '.' : 'Nothing on this path yet.') + '</p></div>' +
      '</div></section>' +
      '<section class="part"><h2>Find</h2><div><p>Which stops did the ' + path.goal.achievers + ' alumni who got there share more often than all ' + api.ALUMNI_TOTAL + ' alumni did, and whose start was closest to yours?</p></div></section>' +
      '<section class="part solved"><h2>Solution</h2><div>' +
        '<p class="soft">Circle size is how many of the ' + path.goal.achievers + ' did it. Anything under 1.5× lift is left off, because everyone does it.</p>' +
        plot(path) + table(path) + answer(path) +
      '</div></section>' +
      '<section class="part solved"><h2>Ask</h2><div>' + people(path) + '</div></section>' +
      '<section class="part solved"><h2>This week</h2><div>' + week(path) +
        '<p class="fine soft">Counts only: “9 of 14 did this” is what happened, not a promise. Every person and event here is seeded demo data.</p></div></section>' +
      '</div>'
    if (keepFocus || !state.solved) document.getElementById('goal').focus()
  }

  function renderReply(id) {
    var ask = api.getAsk(id), first = ask.student.name.split(' ')[0], accepted = ask.status === 'accepted'
    document.body.dataset.solved = 'true'
    app.innerHTML = '<main class="slip"><header class="head"><div><span class="cap">Pad</span><strong class="hand">WarmPath</strong></div><div><span class="cap">Re</span><span class="entry hand">15-minute call</span></div></header>' +
      '<div class="memo"><div><span class="cap">From</span><span><b class="hand">' + esc(ask.student.name) + '</b>, ' + ask.student.major + ', ' + api.ordinal(ask.student.school_year) + ' year</span></div>' +
      '<div><span class="cap">To</span><span><b class="hand">' + esc(ask.alum.name) + '</b>, ' + ask.alum.major + ' ’' + String(ask.alum.grad_year).slice(2) + '</span></div></div>' +
      '<h1 class="hand">' + esc(first) + ' is asking for 15 minutes.</h1>' +
      '<p><mark>' + esc(ask.shared_tie.replace('your next stop', first + '’s next stop')) + '.</mark></p>' +
      '<h2 class="cap">' + esc(first) + '’s question</h2><p class="msg hand">' + esc(ask.message) + '</p>' +
      (accepted
        ? '<div class="done hand">' + TICK + 'Accepted</div><p class="after soft">' + esc(first) + ' can see that you said yes.</p>'
        : '<button class="btn ink" data-accept="' + ask.id + '">Accept a 15-minute call</button><p class="after soft">One tap. No account needed.</p>') +
      '</main>'
  }

  app.addEventListener('submit', function (e) {
    e.preventDefault()
    state.goal = document.getElementById('goal').value
    state.solved = true
    render()
    document.getElementById('goal').blur()
  })
  app.addEventListener('click', function (e) {
    var t = e.target, hit
    if ((hit = t.closest('[data-student]'))) { state.studentId = Number(hit.dataset.student); state.composing = null }
    else if (t.closest('#home')) { state.solved = false; state.selected = null; state.composing = null }
    else if ((hit = t.closest('.work button.r, .bubble'))) { var id = Number(hit.dataset.id); state.selected = state.selected === id ? null : id; state.composing = null }
    else if (t.closest('[data-all]')) { state.selected = null }
    else if ((hit = t.closest('[data-ask]'))) { state.composing = Number(hit.dataset.ask) }
    else if (t.closest('[data-cancel]')) { state.composing = null }
    else if ((hit = t.closest('[data-send]'))) {
      var alum = Number(hit.dataset.send)
      api.postAsk({ student_id: state.studentId, alum_id: alum, goal_id: 12, message: app.querySelector('[data-draft="' + alum + '"]').value })
      state.composing = null
      return // the subscription re-renders
    }
    else if ((hit = t.closest('[data-accept]'))) { api.acceptAsk(hit.dataset.accept); return }
    else return
    state.goal = (document.getElementById('goal') || {}).value || state.goal
    render()
  })
  app.addEventListener('keydown', function (e) {
    var bubble = e.target.closest && e.target.closest('.bubble')
    if (bubble && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); bubble.dispatchEvent(new MouseEvent('click', { bubbles: true })) }
  })
  api.subscribe(render)
  window.addEventListener('hashchange', render)
  render()
})()
</script>
</body>
</html>
