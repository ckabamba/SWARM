<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WarmPath · Campus resources</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mona+Sans:wdth,wght@75..125,200..900&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #06040b;
    --ash: #8f8798;          /* quiet text on the void */
    --bone: #f4eee6;         /* body text */
    --ember: #ff6a1f;
    --gold: #eaaa00;         /* Georgia Tech Buzz Gold */
    --glow: #ffe9a8;         /* hottest: actions, the lit state */
    --line: rgba(244, 238, 230, 0.16);
    --panel: rgba(9, 6, 15, 0.84);
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
    --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--void);
    color: var(--bone);
    font-family: 'Mona Sans', system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
  }
  ::selection { background: var(--ember); color: var(--void); }
  button, input, textarea { font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 1px solid var(--glow); outline-offset: 4px; }

  /* ---------- layers ---------- */
  .field, .swarm, .veil, .hive { position: fixed; inset: 0; }
  .hive { pointer-events: none; transition: opacity 500ms ease; }
  [data-view='map'] .hive { opacity: 0; }
  .field { opacity: 0.72; transition: opacity 1400ms var(--ease-out); }
  [data-view='map'] .field { opacity: 0.5; }
  [data-view='reply'] .field { opacity: 0.55; }
  [data-accepted='true'] .field { opacity: 1; }
  .swarm { mix-blend-mode: screen; pointer-events: none; }
  .veil {
    pointer-events: none;
    background: radial-gradient(78% 74% at 50% 50%, rgba(6, 4, 11, 0.94) 0%, rgba(6, 4, 11, 0.8) 48%, rgba(6, 4, 11, 0.1) 100%);
  }
  .ui { position: fixed; inset: 0; }

  /* small tracked caps: the one label voice */
  .cap {
    font-size: 10.5px;
    font-stretch: 118%;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  .quiet { color: var(--ash); }

  /* ---------- top bar ---------- */
  .bar {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 30px 40px;
    z-index: 5;
  }
  .mark { display: flex; align-items: center; gap: 10px; font-stretch: 112%; font-weight: 600; letter-spacing: 0.02em; background: none; border: 0; padding: 0; }
  .mark i {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--glow);
  }
  .switch {
    position: relative;
    display: grid; grid-template-columns: 1fr 1fr;
    padding: 4px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(9, 6, 15, 0.6);
  }
  .switch button {
    position: relative; z-index: 1;
    padding: 9px 18px;
    border: 0; background: none; border-radius: 999px;
    color: var(--ash);
    transition: color 200ms ease;
    white-space: nowrap;
  }
  .switch button[aria-pressed='true'] { color: var(--void); }
  .switch .thumb {
    position: absolute; top: 4px; bottom: 4px; left: 4px;
    width: calc(50% - 4px);
    border-radius: 999px;
    background: var(--glow);
    transition: transform 320ms var(--ease-in-out);
  }
  .switch[data-index='1'] .thumb { transform: translateX(100%); }

  /* ---------- goal view ---------- */
  .goal {
    position: absolute; inset: 0;
    transition: opacity 420ms ease, filter 420ms ease, transform 420ms var(--ease-out);
  }
  [data-view='map'] .goal { opacity: 0; filter: blur(10px); transform: scale(0.985); pointer-events: none; }

  /* The landing is three screens tall. Scrolling it turns the honeycomb. */
  .landing {
    position: absolute; inset: 0; overflow-y: auto; scroll-snap-type: y proximity; overscroll-behavior: contain; scrollbar-width: none;
    mask-image: linear-gradient(to bottom, transparent 40px, #000 150px, #000 calc(100% - 130px), transparent calc(100% - 60px));
  }
  .landing::-webkit-scrollbar { display: none; }
  .beat { position: relative; min-height: 100%; display: grid; align-content: center; justify-items: start; padding: 0 8vw; scroll-snap-align: start; }
  .beat h1, .beat .say {
    margin: 0; max-width: 10.5em;
    font-size: clamp(32px, 4.3vw, 64px); font-weight: 300; font-stretch: 108%;
    letter-spacing: -0.03em; line-height: 1.08; text-wrap: balance;
  }
  /* Words arrive one at a time, out of a blur. After React Bits' BlurText, done in CSS. */
  .word { display: inline-block; }
  .beat:not([data-seen]) .word { opacity: 0; }
  .beat[data-seen] .word { animation: word-in 700ms var(--ease-out) both; animation-delay: calc(var(--i) * 45ms); }
  @keyframes word-in { from { opacity: 0; filter: blur(10px); transform: translateY(0.25em); } }
  .beat.right { justify-items: end; }
  .beat.right .say { text-align: right; }
  .beat .jump { margin-top: 34px; padding: 4px 0; border: 0; background: none; color: var(--ash); transition: color 160ms ease; }
  .beat .jump::before { content: '->'; margin-right: 10px; color: var(--ember); }
  @media (hover: hover) and (pointer: fine) { .beat .jump:hover { color: var(--bone); } }
  .cue { position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%); margin: 0; color: var(--ash); transition: opacity 300ms ease; pointer-events: none; }
  .goal[data-scrolled] .cue { opacity: 0; }
  .beat.ask { justify-items: center; }
  .goal form { width: min(1040px, 84vw); }
  .goal label { display: block; margin-bottom: 26px; color: var(--ash); font-size: 17px; }
  .goal .row { display: flex; align-items: flex-end; gap: 22px; border-bottom: 1px solid var(--line); padding-bottom: 16px; transition: border-color 200ms ease; }
  .goal .row:focus-within { border-color: rgba(255, 233, 168, 0.7); }
  .goal input {
    flex: 1; min-width: 0;
    background: none; border: 0; outline: 0; padding: 0;
    font-size: clamp(34px, 5.2vw, 76px);
    font-weight: 300;
    font-stretch: 108%;
    letter-spacing: -0.03em;
    line-height: 1.08;
    caret-color: var(--ember);
  }
  .goal input::placeholder { color: rgba(244, 238, 230, 0.5); }
  .go {
    flex: none;
    width: 58px; height: 58px; margin-bottom: 6px;
    display: grid; place-items: center;
    border-radius: 50%; border: 1px solid var(--line);
    background: none;
    transition: transform 160ms var(--ease-out), background-color 200ms ease, border-color 200ms ease;
  }
  .go:active { transform: scale(0.95); }
  .go svg { width: 20px; height: 20px; transition: transform 240ms var(--ease-out); }
  @media (hover: hover) and (pointer: fine) {
    .go:hover { background: var(--glow); border-color: var(--glow); color: var(--void); }
    .go:hover svg { transform: translateX(3px); }
  }
  .seeds { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 26px 0 0; padding: 0; list-style: none; }
  .seeds button { background: none; border: 0; padding: 4px 0; color: var(--ash); transition: color 160ms ease; }
  .seeds button::before { content: '->'; margin-right: 10px; color: var(--ember); }
  @media (hover: hover) and (pointer: fine) { .seeds button:hover { color: var(--bone); } }

  .foot { position: absolute; left: 40px; right: 40px; bottom: 30px; margin: 0; display: flex; justify-content: space-between; gap: 24px; pointer-events: none; }
  .foot a { color: inherit; pointer-events: auto; text-underline-offset: 4px; }

  /* ---------- map view ---------- */
  .map { position: absolute; inset: 0; pointer-events: none; }
  .map > * { pointer-events: auto; }
  .node {
    position: absolute; left: 0; top: 0;
    width: var(--d); height: var(--d);
    margin: calc(var(--d) / -2) 0 0 calc(var(--d) / -2);
    background: none; border: 0; padding: 0;
    text-align: left;
    opacity: 0;
    transition: opacity 700ms var(--ease-out);
  }
  [data-view='map'] .node { opacity: 1; transition-delay: var(--at, 0ms); }
  /* Each checkpoint is one cell of the honeycomb: same flat-topped shape, sized by its count. */
  .node .hex { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; transition: transform 200ms var(--ease-out); }
  .hex path { vector-effect: non-scaling-stroke; }
  .hex .base { fill: rgba(6, 4, 11, 0.5); }
  .hex .hot { fill: url(#hot); opacity: 0; transition: opacity 500ms ease; }
  .hex .edge { fill: none; stroke: rgba(244, 238, 230, 0.55); stroke-width: 1; stroke-linejoin: round; transition: stroke 500ms ease; }
  .hex .pulse { fill: none; stroke: var(--glow); stroke-width: 1; opacity: 0; transform-box: fill-box; transform-origin: center; }
  .node[data-have='true'] .hot { opacity: 1; }
  .node[data-have='true'] .edge { stroke: var(--glow); }
  .node[data-next='true'] .edge { stroke: var(--glow); stroke-dasharray: 5 4; }
  .node[data-next='true'] .pulse { animation: ping 2200ms var(--ease-out) infinite; }
  @keyframes ping { from { transform: scale(1); opacity: 0.75; } to { transform: scale(2); opacity: 0; } }
  @media (hover: hover) and (pointer: fine) { .node:hover .hex { transform: scale(1.08); } }
  .node:active .hex { transform: scale(0.96); }
  .node:focus-visible { outline: 0; }
  .node:focus-visible .edge { stroke: var(--glow); stroke-width: 2.5; stroke-dasharray: none; }

  .node .tag {
    position: absolute;
    left: calc(100% + 16px); top: 50%;
    width: 230px;
    transform: translateY(-50%);
  }
  .node[data-side='left'] .tag { left: auto; right: calc(100% + 16px); text-align: right; }
  .node[data-side='below'] .tag { left: 50%; margin-left: -115px; top: calc(100% + 14px); transform: none; text-align: center; }
  .node[data-side='above'] .tag { left: 50%; margin-left: -115px; top: auto; bottom: calc(100% + 14px); transform: none; text-align: center; }
  .node .state, .node .when { animation: settle 400ms ease both; }
  @keyframes settle { from { opacity: 0; } }
  .node .name { display: block; font-size: 17px; font-weight: 500; font-stretch: 105%; letter-spacing: -0.005em; line-height: 1.2; }
  .node .count { display: block; margin-top: 5px; color: var(--ash); font-size: 13.5px; }
  .node .count b { color: var(--bone); font-weight: 600; }
  .node .state { display: block; margin-top: 7px; color: var(--glow); }
  .node .when { display: block; margin-top: 4px; font-size: 13px; color: var(--bone); }

  .end .name { font-size: 21px; }

  .strip {
    position: absolute; left: 40px; bottom: 30px;
    width: min(500px, 38vw);
    opacity: 0; transform: translateY(12px);
    transition: opacity 600ms var(--ease-out), transform 600ms var(--ease-out);
  }
  [data-view='map'] .strip { opacity: 1; transform: none; transition-delay: 3700ms; }
  .strip h2, .closest h2 { margin: 0 0 12px; font-weight: 500; color: var(--ash); }
  .strip ol { margin: 0; padding: 0; list-style: none; }
  .strip li { display: grid; grid-template-columns: 62px 1fr; gap: 14px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
  .strip li div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .strip li b { font-weight: 600; }
  .strip li span { color: var(--ash); }

  .closest {
    position: absolute; right: 40px; bottom: 30px;
    width: min(300px, 26vw);
    opacity: 0; transform: translateY(12px);
    transition: opacity 600ms var(--ease-out), transform 600ms var(--ease-out);
  }
  [data-view='map'] .closest { opacity: 1; transform: none; transition-delay: 3900ms; }
  .closest button {
    width: 100%;
    display: flex; justify-content: space-between; gap: 12px;
    padding: 8px 0; border: 0; border-top: 1px solid var(--line);
    background: none; text-align: left; font-size: 13.5px;
  }
  .closest button b { font-weight: 600; transition: color 160ms ease; }
  .closest button span { color: var(--ash); }
  @media (hover: hover) and (pointer: fine) { .closest button:hover b { color: var(--glow); } }

  /* ---------- people panel ---------- */
  .panel {
    position: absolute; top: 0; right: 0; bottom: 0;
    width: min(460px, 92vw);
    padding: 96px 34px 34px;
    background: var(--panel);
    backdrop-filter: blur(22px);
    border-left: 1px solid var(--line);
    overflow-y: auto;
    transform: translateX(100%);
    transition: transform 240ms var(--ease-out);
    z-index: 4;
  }
  .panel[data-open='true'] { transform: none; transition: transform 460ms var(--ease-drawer); }
  .panel h2 { margin: 0 70px 0 0; font-size: 26px; font-weight: 400; font-stretch: 106%; letter-spacing: -0.02em; line-height: 1.15; }
  .panel .lede { margin: 12px 0 26px; color: var(--ash); font-size: 14px; max-width: 34ch; }
  .panel .close { position: absolute; top: 102px; right: 34px; background: none; border: 0; padding: 6px 0; color: var(--ash); }
  .person { padding: 18px 0; border-top: 1px solid var(--line); }
  .person header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .person h3 { margin: 0; font-size: 17px; font-weight: 600; }
  .person .who { color: var(--ash); font-size: 13px; }
  .person .tie { margin: 8px 0 12px; font-size: 14px; color: #f6cfa6; max-width: 38ch; }
  .person .more { margin: 14px 0 0; color: var(--ash); font-size: 13px; }
  .pill {
    padding: 9px 18px;
    border-radius: 999px; border: 1px solid var(--line);
    background: none;
    transition: transform 160ms var(--ease-out), background-color 200ms ease, border-color 200ms ease, color 200ms ease;
  }
  .pill:active { transform: scale(0.97); }
  .pill.hot { background: var(--glow); border-color: var(--glow); color: var(--void); }
  @media (hover: hover) and (pointer: fine) {
    .pill:hover { border-color: var(--glow); }
    .pill.hot:hover { background: #fff5d3; }
  }
  .draft { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 260ms var(--ease-out); }
  .draft[data-open='true'] { grid-template-rows: 1fr; }
  .draft > div { overflow: hidden; }
  .draft textarea {
    width: 100%; min-height: 168px; margin-top: 14px; padding: 14px 16px;
    border: 1px solid var(--line); border-radius: 12px;
    background: rgba(244, 238, 230, 0.04);
    font-size: 14px; line-height: 1.55; resize: vertical;
    caret-color: var(--ember);
  }
  .draft textarea:focus { outline: 0; border-color: rgba(255, 233, 168, 0.6); }
  .draft .acts { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
  .status { display: flex; align-items: center; gap: 10px; font-size: 13.5px; }
  .status i { width: 7px; height: 7px; border-radius: 50%; background: var(--ash); }
  .status[data-status='accepted'] { color: var(--glow); }
  .status[data-status='accepted'] i { background: var(--glow); }
  .status a { color: inherit; text-underline-offset: 4px; }

  /* ---------- alum reply page ---------- */
  .reply { position: absolute; inset: 0; overflow-y: auto; display: grid; place-items: center; padding: 40px 22px; }
  .reply article { width: min(400px, 100%); }
  .reply h1 { margin: 34px 0 10px; font-size: 34px; font-weight: 300; font-stretch: 106%; letter-spacing: -0.03em; line-height: 1.1; text-wrap: balance; }
  .reply .who { margin: 0 0 28px; color: var(--ash); }
  .reply dl { margin: 0; }
  .reply dt { margin: 22px 0 8px; color: var(--ash); }
  .reply dd { margin: 0; }
  .reply .tie { color: #f6cfa6; font-size: 16px; }
  .reply .msg { padding: 16px 18px; border: 1px solid var(--line); border-radius: 14px; background: rgba(9, 6, 15, 0.55); font-size: 14.5px; line-height: 1.6; }
  .accept {
    position: relative; overflow: hidden;
    width: 100%; margin-top: 30px; padding: 20px;
    border-radius: 999px; border: 0;
    background: var(--glow); color: var(--void);
    font-size: 16px; font-weight: 600;
    transition: transform 160ms var(--ease-out), background-color 300ms ease, color 300ms ease;
  }
  .accept:active { transform: scale(0.97); }
  .accept[disabled] { background: rgba(255, 233, 168, 0.14); color: var(--glow); cursor: default; }
  .reply .after { margin: 16px 0 0; text-align: center; color: var(--ash); font-size: 13.5px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: 150ms !important; transition-delay: 0ms !important; }
    .panel, .strip, .closest, .goal { transform: none !important; }
    .panel:not([data-open='true']) { visibility: hidden; }
  }

  .connections { position: absolute; inset: 0; pointer-events: none; opacity: .65; }
  .connections path { fill: none; stroke: var(--ember); stroke-width: 1; }
  .connections .saved { stroke: var(--gold); stroke-width: 2; }
  .toolbar { display:flex; gap:10px; align-items:center; }
  .toolbar button { white-space:nowrap; }
  .notice { color:var(--glow); font-size:14px; max-width:62ch; }
  .error { color:#ffb39b; }
  .graph-caption { position:absolute; top:90px; left:40px; right:40px; color:var(--ash); max-width:75ch; font-size:13px; }
  .catalog { position:absolute; top:145px; left:8vw; right:8vw; bottom:160px; overflow:auto; display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:18px; align-content:start; }
  .resource-card { padding:18px; text-align:left; border:1px solid var(--line); background:var(--panel); border-radius:14px; }
  .resource-card h3 { font-weight:500; margin:0 0 8px; }
  .resource-card p { margin:0; color:var(--ash); }
  .panel .pill { margin:12px 8px 0 0; display:inline-block; text-decoration:none; }
  .panel dl { margin:24px 0; }
  .panel dt { color:var(--ash); font-size:12px; margin-top:18px; }
  .panel dd { margin:4px 0; }
  .panel a { color:var(--glow); }
  .panel { overflow-y:auto; }
  .boot { position:fixed; inset:0; display:grid; place-content:center; padding:30px; }
  .boot p { max-width:65ch; }
  button:disabled { cursor:wait; opacity:.55; }
  .events-panel { max-height:65vh; overflow:auto; }
  .events-panel article { padding:18px 0; border-top:1px solid var(--line); }
  .events-panel h3 { font-size:16px; margin:0 0 6px; }
  [data-view='map'] .strip, [data-view='map'] .closest { transition-delay:0ms; }
  .strip a { color:var(--bone); text-decoration:none; }
  .strip .event-note { color:var(--ash); font-size:12px; margin:6px 0; }
  .graph-actions { position:absolute; right:40px; bottom:32px; max-width:340px; }
  .graph-actions p { font-size:13px; color:var(--ash); }
  .local-label { font-size:11px; color:var(--ash); }
  .job-choice { margin-top:22px; }
  .job-choice label { font-size:14px; margin-bottom:8px; }
  .job-choice select { max-width:75%; background:var(--panel); color:var(--bone); padding:10px; border:1px solid var(--line); border-radius:10px; font:inherit; }
  .job-choice .pill { margin-left:10px; }
  .topic-list { display:flex; flex-wrap:wrap; gap:6px; margin:16px 0; }
  .topic-list span { border:1px solid var(--line); border-radius:999px; padding:4px 9px; font-size:12px; }
  .job-match { border-top:1px solid var(--line); padding:16px 0; }
  .job-match h4 { font-weight:500; margin:0 0 8px; }
  .job-match p { font-size:13px; color:var(--ash); }
  @media(max-width:900px) { .bar { padding:20px; } .toolbar { gap:4px; } .toolbar .pill { padding:8px; font-size:12px; } .local-label { display:none; } .graph-caption { left:20px; right:20px; } .graph-actions { display:none; } .strip { width:calc(100% - 40px); left:20px; } .catalog { bottom:220px; } }
</style>

<script type="text/babel" data-type="module" data-presets="react">
import React, { useEffect, useRef, useState } from 'react'
import { createRoot } from 'react-dom/client'
import * as THREE from 'three'
import { Canvas, useFrame, useThree } from '@react-three/fiber'
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'
import { ShaderGradientCanvas, ShaderGradient } from '@shadergradient/react'

const api = window.WarmPathAPI
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches

/* Where each stop sits, as fractions of the stage. x follows the stop's typical year. */
const SPOTS = {
  you: { x: 0.085, y: 0.52, side: 'below' },
  5: { x: 0.255, y: 0.25, side: 'above' },
  3: { x: 0.405, y: 0.6, side: 'below' },
  4: { x: 0.63, y: 0.3, side: 'above' },
  7: { x: 0.54, y: 0.86, side: 'below' },
  9: { x: 0.745, y: 0.66, side: 'below' },
  goal: { x: 0.895, y: 0.42, side: 'above' },
}
const HEX_R = 26

/*
 * Honeycomb cell centres, built ring by ring around the origin.
 * Adapted from prisoner849's lattice: https://jsfiddle.net/prisoner849/jzLdcemb/
 */
function hexLattice(rings) {
  const unit = Math.sqrt(3) * HEX_R
  const angle = Math.PI / 3
  const axis = new THREE.Vector3(0, 0, 1)
  const axisVector = new THREE.Vector3(0, -unit, 0)
  const sideVector = new THREE.Vector3(0, unit, 0).applyAxisAngle(axis, -angle)
  const pts = [new THREE.Vector3()]
  const temp = new THREE.Vector3()
  for (let seg = 0; seg < 6; seg++) {
    for (let ax = 1; ax <= rings; ax++) {
      for (let sd = 0; sd < ax; sd++) {
        temp.copy(axisVector).multiplyScalar(ax).addScaledVector(sideVector, sd).applyAxisAngle(axis, angle * seg)
        pts.push(temp.clone())
      }
    }
  }
  return pts
}

/* Which cell of that lattice a point falls in. */
function hexKey(x, y) {
  const q = ((2 / 3) * x) / HEX_R, r = (-x / 3 + (Math.sqrt(3) / 3) * y) / HEX_R
  let rq = Math.round(q), rr = Math.round(r)
  const rs = Math.round(-q - r)
  const dq = Math.abs(rq - q), dr = Math.abs(rr - r), ds = Math.abs(rs + q + r)
  if (dq > dr && dq > ds) rq = -rr - rs
  else if (dr > ds) rr = -rq - rs
  return rq + ',' + rr
}

function useViewport() {
  const [size, setSize] = useState({ w: window.innerWidth, h: window.innerHeight })
  useEffect(() => {
    const on = () => setSize({ w: window.innerWidth, h: window.innerHeight })
    window.addEventListener('resize', on)
    return () => window.removeEventListener('resize', on)
  }, [])
  return size
}

/* A stop's position, moved onto the centre of the honeycomb cell it lands in. */
function place(key, { w, h }) {
  const spot = SPOTS[key] || SPOTS[9]
  const top = 100, bottom = 176
  const x = spot.x * w, y = top + spot.y * (h - top - bottom)
  const [q, r] = hexKey(x - w / 2, h / 2 - y).split(',').map(Number)
  return { x: w / 2 + HEX_R * 1.5 * q, y: h / 2 - HEX_R * Math.sqrt(3) * (r + q / 2), side: spot.side }
}

/* ------------------------------------------------------------------ WebGL */

const POSES = [
  { x: 0.24, y: -0.01, size: 1.55, tilt: 0.95, turn: -0.55, roll: 0.1, alpha: 1 },     // beside the opening line
  { x: -0.26, y: 0.0, size: 1.65, tilt: 0.28, turn: 2.2, roll: -0.18, alpha: 1 },      // swung across, seen edge on
  { x: 0.31, y: 0.22, size: 0.88, tilt: Math.PI / 2, turn: 4.4, roll: 0, alpha: 0.6 }, // face on, clear of the goal field
]

/* If the model file cannot load (a page opened straight from disk), stand in seven cells from the same lattice. */
function standInComb() {
  const comb = new THREE.Group()
  const cell = new THREE.CylinderGeometry(0.98, 0.98, 1, 6, 1, true)
  const wax = new THREE.MeshStandardMaterial({ color: '#d9a52c', roughness: 0.85, side: THREE.DoubleSide })
  hexLattice(1).forEach((p, i) => {
    const mesh = new THREE.Mesh(cell, wax)
    mesh.position.set(p.x / HEX_R, 0, p.y / HEX_R)
    mesh.rotation.y = Math.PI / 6
    mesh.scale.y = 0.55 + (i % 3) * 0.12
    comb.add(mesh)
  })
  comb.scale.setScalar(0.38)
  return comb
}

function Hive({ scroll }) {
  const { viewport, gl } = useThree()
  const group = useRef()
  const [comb, setComb] = useState(null)
  const live = useRef({ p: 0, px: 0, py: 0, mx: 0, my: 0 })

  useEffect(() => {
    let mounted = true
    new GLTFLoader().load('models/honeycomb.glb',
      (gltf) => {
        gltf.scene.position.set(0.05, 0.11, 0.07)
        gltf.scene.traverse((o) => { if (o.isMesh) { o.material.color.set('#ffcf85'); o.material.roughness = 0.6; o.material.metalness = 0.2 } })
        if (mounted) setComb(gltf.scene)
      },
      undefined,
      () => { if (mounted) setComb(standInComb()) })
    const move = (e) => { live.current.mx = e.clientX / window.innerWidth - 0.5; live.current.my = e.clientY / window.innerHeight - 0.5 }
    window.addEventListener('pointermove', move)
    return () => { mounted = false; window.removeEventListener('pointermove', move) }
  }, [])

  useFrame(({ clock }, dt) => {
    const s = live.current, g = group.current
    const follow = REDUCED ? 1 : 1 - Math.exp(-dt * 5)
    s.p += (scroll.current - s.p) * follow
    s.px += (s.mx - s.px) * follow; s.py += (s.my - s.py) * follow
    const leg = Math.min(POSES.length - 2, Math.floor(s.p * (POSES.length - 1)))
    const k = Math.min(1, Math.max(0, s.p * (POSES.length - 1) - leg)), f = k * k * (3 - 2 * k)
    const a = POSES[leg], b = POSES[leg + 1]
    const mix = (key) => a[key] + (b[key] - a[key]) * f
    const idle = REDUCED ? 0 : clock.elapsedTime * 0.12
    g.position.set(mix('x') * viewport.width, mix('y') * viewport.height, 0)
    g.scale.setScalar(mix('size'))
    g.rotation.set(mix('tilt') + s.py * 0.25, mix('turn') + idle, mix('roll') + s.px * 0.2)
    gl.domElement.style.opacity = mix('alpha')
  })

  return <group ref={group}>{comb && <primitive object={comb} />}</group>
}

function Backdrop() {
  return (
    <div className="field" aria-hidden="true">
      <ShaderGradientCanvas style={{ position: 'absolute', inset: 0 }} pixelDensity={1} fov={45}>
        <ShaderGradient
          type="waterPlane" animate={REDUCED ? 'off' : 'on'} uSpeed={0.12} uStrength={2.6} uDensity={1.1} uFrequency={5.5}
          color1="#ff8a2a" color2="#ee9b00" color3="#050c1c"
          cDistance={4.4} cPolarAngle={74} cAzimuthAngle={200} positionY={0.6}
          lightType="3d" brightness={0.72} reflection={0.05} grain="on" enableTransition={false}
        />
      </ShaderGradientCanvas>
    </div>
  )
}

/* Flat-topped hexagon with eased corners, in a 100-unit box. Matches the lattice's orientation. */
const HEX_PATH = (() => {
  const c = 50, R = 49, ease = 0.17
  const v = Array.from({ length: 6 }, (_, i) => [c + R * Math.cos((i * Math.PI) / 3), c + R * Math.sin((i * Math.PI) / 3)])
  const toward = (p, o) => `${(p[0] + (o[0] - p[0]) * ease).toFixed(2)} ${(p[1] + (o[1] - p[1]) * ease).toFixed(2)}`
  return v.map((p, i) => `${i ? 'L' : 'M'}${toward(p, v[(i + 5) % 6])}Q${p[0].toFixed(2)} ${p[1].toFixed(2)} ${toward(p, v[(i + 1) % 6])}`).join('') + 'Z'
})()

function Hex() {
  return (
    <svg className="hex" viewBox="0 0 100 100" aria-hidden="true">
      <path className="pulse" d={HEX_PATH} />
      <path className="base" d={HEX_PATH} />
      <path className="hot" d={HEX_PATH} />
      <path className="edge" d={HEX_PATH} />
    </svg>
  )
}

function Words({ as: Tag, className, children }) {
  return (
    <Tag className={className} aria-label={children}>
      {children.split(' ').map((word, i) => (
        <React.Fragment key={i}><span className="word" aria-hidden="true" style={{ '--i': i }}>{word}</span>{' '}</React.Fragment>
      ))}
    </Tag>
  )
}

function Arrow() {
  return (
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
      <path d="M3 10h14M11 4l6 6-6 6" />
    </svg>
  )
}


class GraphicsBoundary extends React.Component {
  state = { failed: false }
  static getDerivedStateFromError() { return { failed: true } }
  render() { return this.state.failed ? null : this.props.children }
}

function ResourceNode({ resource, at, onOpen }) {
  return <button className="node" data-have={resource.saved} data-side={at.side}
    style={{ transform: `translate(${at.x}px, ${at.y}px)`, '--d': '50px', '--at': '0ms' }}
    onClick={onOpen} aria-label={`Explore ${resource.name}`}>
    <Hex /><span className="tag"><span className="name">{resource.name}</span>
    <span className="count">{resource.kind}</span>{resource.saved && <span className="state cap">Saved</span>}</span>
  </button>
}

function EventList({ data }) {
  const format = value => new Intl.DateTimeFormat('en-US', { timeZone:'America/New_York', month:'short', day:'numeric', hour:'numeric', minute:'2-digit' }).format(new Date(value))
  return <div className="events-panel">
    <p className="quiet">Public GT Engage and Campus Calendar listings. Times are Eastern. Date ranges may represent recurring sessions; confirm the schedule and registration at the source.</p>
    {data?.stale && <p className="notice">This snapshot is more than 24 hours old or has not been imported. Check the source for updates.</p>}
    {data?.fetched_at && <p className="quiet">Last checked: {format(data.fetched_at)}</p>}
    {!data?.items?.length && <p>No upcoming events in the current local snapshot.</p>}
    {(data?.items || []).map(event => <article key={event.url}>
      <h3><a href={event.url} target="_blank" rel="noreferrer">{event.title}</a></h3>
      <p className="quiet">{format(event.starts_at)} – {format(event.ends_at)}</p>
      {event.location && <p>{event.location}</p>}
      <p className="quiet">{event.source === 'gt-engage' ? 'GT Engage' : 'Campus Calendar'}{event.organizer ? ` · ${event.organizer}` : ''}</p>
    </article>)}
    <a href="https://gatech.campuslabs.com/engage/events" target="_blank" rel="noreferrer">Explore more on GT Engage ↗</a>
  </div>
}

function Experience({ session, onProfile, onCourses, initialRoute = 'home' }) {
  const [view, setView] = useState('goal')
  const [goalText, setGoalText] = useState(session.goal || '')
  const [result, setResult] = useState(null)
  const [items, setItems] = useState([])
  const [listMode, setListMode] = useState(false)
  const [panel, setPanel] = useState(null)
  const [busy, setBusy] = useState(false)
  const [saving, setSaving] = useState(false)
  const [error, setError] = useState('')
  const [eventData, setEventData] = useState(null)
  const [eventError, setEventError] = useState('')
  const [eventBusy, setEventBusy] = useState(false)
  const [jobExamples, setJobExamples] = useState([])
  const [selectedJob, setSelectedJob] = useState('')
  const [jobError, setJobError] = useState('')
  const viewport = useViewport()
  const landing = useRef(null), goalInput = useRef(null), scroll = useRef(0), sequence = useRef(0)
  const closeButton = useRef(null), lastFocus = useRef(null)
  const active = typeof panel === 'number' ? items.find(item => item.id === panel) : null
  const slots = [5, 3, 7, 4, 9]
  const you = place('you', viewport), goal = place('goal', viewport)

  useEffect(() => { document.body.dataset.view = view }, [view])
  useEffect(() => {
    const observer = new IntersectionObserver(entries => entries.forEach(entry => {
      if (entry.isIntersecting) entry.target.dataset.seen = 'true'
    }), { root: landing.current, threshold:.4 })
    landing.current.querySelectorAll('.beat').forEach(node => observer.observe(node))
    return () => observer.disconnect()
  }, [])
  useEffect(() => {
    if (panel !== null) { lastFocus.current = document.activeElement; closeButton.current?.focus() }
    else lastFocus.current?.focus()
  }, [panel])
  useEffect(() => {
    const onKey = event => { if (event.key === 'Escape') setPanel(null) }
    window.addEventListener('keydown', onKey)
    return () => window.removeEventListener('keydown', onKey)
  }, [])

  const loadEvents = async () => {
    setEventBusy(true); setEventError('')
    try { setEventData(await api.events()) }
    catch (e) { setEventError(e.message) }
    finally { setEventBusy(false) }
  }
  useEffect(() => { loadEvents() }, [])
  useEffect(() => { let active = true; api.jobs().then(data => { if(active) setJobExamples(data.items) }).catch(e => { if(active) setJobError(e.message) }); return () => { active = false } }, [])

  const discover = async (text = goalText, jobId = null) => {
    if (busy) return
    const query = text.trim()
    if (!query) { setError('Enter a goal or choose a suggestion.'); goalInput.current?.focus(); return }
    const id = ++sequence.current
    setBusy(true); setError(''); setPanel(null)
    try {
      const response = await api.path(query, jobId)
      if (id !== sequence.current) return
      setGoalText(query); setResult(response); setItems(response.resources); setListMode(false); setView('map')
    } catch (e) { if (id === sequence.current) setError(e.message) }
    finally { if (id === sequence.current) setBusy(false) }
  }
  const browse = async (saved = false) => {
    if (busy) return
    const id = ++sequence.current
    setBusy(true); setError(''); setPanel(null)
    try {
      const response = await api.resources(saved)
      if (id !== sequence.current) return
      setResult({ goal:{ label:saved ? 'Your saved resources' : 'Campus resources' }, status:'browse' })
      setItems(response.items); setListMode(saved ? 'saved' : 'all'); setView('map')
    } catch (e) { if (id === sequence.current) setError(e.message) }
    finally { if (id === sequence.current) setBusy(false) }
  }
  useEffect(() => { if (initialRoute === 'discovery') browse(false) }, [initialRoute])
  const toggleSaved = async resource => {
    if (saving) return
    setSaving(true); setError('')
    try {
      const updated = await api.save(resource.id, !resource.saved)
      if (listMode === 'saved' && !updated.saved) {
        setItems(current => current.filter(item => item.id !== updated.id)); setPanel(null)
      } else {
        setItems(current => current.map(item => item.id === updated.id ? {...item, saved:updated.saved} : item))
      }
    } catch (e) { setError(e.message) }
    finally { setSaving(false) }
  }
  const toGoal = () => { setView('goal'); setPanel(null); setTimeout(() => {
    landing.current.scrollTo({ top:landing.current.scrollHeight, behavior:REDUCED ? 'instant' : 'smooth' })
    goalInput.current?.focus({ preventScroll:true })
  }, 30) }
  const onScroll = () => {
    const el = landing.current
    scroll.current = el.scrollTop / Math.max(1, el.scrollHeight - el.clientHeight)
    el.parentElement.toggleAttribute('data-scrolled', scroll.current > .5)
  }
  const compact = listMode || viewport.w < 900

  return <>
    <GraphicsBoundary><Backdrop /></GraphicsBoundary><div className="veil" />
    <svg width="0" height="0" style={{position:'absolute'}} aria-hidden="true"><defs>
      <radialGradient id="hot"><stop offset="0" stopColor="#fff7dc"/><stop offset=".3" stopColor="#ffe9a8"/><stop offset=".66" stopColor="#eaaa00"/><stop offset="1" stopColor="#8f5c00"/></radialGradient>
    </defs></svg>
    <div className="hive" aria-hidden="true"><GraphicsBoundary>
      <Canvas dpr={[1,1.5]} frameloop={view === 'goal' ? 'always' : 'never'} gl={{alpha:true, antialias:true}} camera={{fov:35, position:[0,0,10]}}>
        <hemisphereLight args={['#ffe2a0','#160a02',.75]}/><directionalLight position={[-3,4,6]} intensity={2.6} color="#fff3d6"/>
        <pointLight position={[3,-2.5,2.5]} intensity={45} color="#ff6a1f"/><Hive scroll={scroll}/>
      </Canvas>
    </GraphicsBoundary></div>
    <main className="ui">
      <header className="bar">
        <button className="mark" onClick={() => { setView('goal'); setPanel(null) }} aria-label="WarmPath home"><i/>WarmPath</button>
        <nav className="toolbar" aria-label="Resource navigation">
          <span className="local-label">Your browser workspace</span>
          <button className="pill" disabled={busy} onClick={() => browse(false)}>Browse</button>
          <button className="pill" disabled={busy} onClick={() => browse(true)}>Saved</button>
          <button className="pill" onClick={() => { setPanel('events'); loadEvents() }}>Events</button>
          <a className="pill" href="./index.html#/discovery">Discovery</a>
          <a className="pill" href="./index.html#/map">Maps</a>
          <button className="pill" onClick={onProfile}>My Profile</button>
          <button className="pill" onClick={onCourses}>My Courses</button>
          <a className="pill" href="./community.html">Social Jackets</a>
          <a className="pill" href="/app/">Alumni paths &amp; history</a>
        </nav>
      </header>
      <section className="goal" aria-hidden={view !== 'goal'} inert={view !== 'goal'}>
        <div className="landing" ref={landing} onScroll={onScroll}>
          <div className="beat"><Words as="h1">Your next step starts on campus.</Words><button className="jump cap" onClick={toGoal}>Find your starting point</button></div>
          <div className="beat right"><Words as="p" className="say">Research teams. Startup programs. Career opportunities. Find the resources that fit your goal.</Words></div>
          <div className="beat ask"><form onSubmit={event => { event.preventDefault(); discover() }}>
            <label htmlFor="goal">What would you like to explore at Georgia Tech?</label>
            <div className="row"><input id="goal" ref={goalInput} maxLength={300} autoComplete="off" value={goalText} onChange={e => setGoalText(e.target.value)} placeholder="Explore robotics research"/>
              <button className="go" disabled={busy} aria-label="Find resources"><Arrow/></button></div>
            <ul className="seeds cap">{session.suggestions.map(label => <li key={label}><button type="button" disabled={busy} onClick={() => discover(label)}>{label}</button></li>)}</ul>
            <div className="job-choice"><label htmlFor="job-example">Or match courses and VIP projects to a public job example</label>
              <select id="job-example" value={selectedJob} onChange={e => setSelectedJob(e.target.value)}>
                <option value="">Choose a source-checked job example</option>
                {jobExamples.map(job => <option key={job.id} value={job.id}>{job.title}</option>)}
              </select>
              <button className="pill" type="button" disabled={busy || !selectedJob} onClick={() => discover(jobExamples.find(job => job.id === selectedJob).title, selectedJob)}>Match topics</button>
              {jobError && <p className="error" role="alert">Job examples unavailable: {jobError}</p>}
            </div>
            <p className="notice" role="status">{busy ? 'Finding campus resources…' : 'Searches match a curated catalog. Open each source to confirm availability.'}</p>
            {error && <p className="notice error" role="alert">{error}</p>}
          </form></div>
        </div>
        <p className="cue cap">Scroll</p>
        <p className="foot cap quiet"><span>{session.resource_count} source-linked campus resources</span><span>Honeycomb by <a href="https://poly.pizza/m/6Mqdrv1n3Oo" target="_blank" rel="noreferrer">Poly by Google</a> · CC BY 3.0</span></p>
      </section>
      {view === 'map' && <section className="map" aria-label="Resource results">
        <div className="graph-caption"><b>{result?.goal.label}</b> · {items.length} {items.length === 1 ? 'resource' : 'resources'}<br/>Explore official campus resources related to your goal.
          {result?.job && <><br/><a href={result.job.url} target="_blank" rel="noreferrer" style={{color:'var(--glow)'}}>View employer listing ↗</a> · Description-based topic matches · Checked {result.job.verified_on}</>}
          {busy && <span role="status"> Loading…</span>}{error && <p className="error" role="alert">{error}</p>}
        </div>
        {!items.length ? <div className="catalog"><div><h2>{result?.status === 'no_match' ? 'No matching resources yet' : 'Nothing saved yet'}</h2>
          <p>Try another goal or browse the campus catalog.</p><button className="pill" onClick={toGoal}>Change goal</button> <button className="pill" onClick={() => browse(false)}>Browse resources</button></div></div>
        : compact ? <div className="catalog">{items.map(resource => <button className="resource-card" key={resource.id} onClick={() => setPanel(resource.id)}>
          <h3>{resource.name}</h3><p>{resource.kind}{resource.saved ? ' · Saved' : ''}</p><p>{resource.summary}</p></button>)}</div>
        : <>
          <svg className="connections" width={viewport.w} height={viewport.h} aria-hidden="true">{items.map((resource, i) => {
            const at = place(slots[i], viewport)
            return <path className={resource.saved ? 'saved' : ''} key={resource.id} d={`M${you.x},${you.y} C${at.x-80},${you.y} ${at.x-80},${at.y} ${at.x},${at.y} S${goal.x-60},${goal.y} ${goal.x},${goal.y}`}/>
          })}</svg>
          <button className="node end" data-side={you.side} style={{transform:`translate(${you.x}px,${you.y}px)`,'--d':'36px'}} onClick={toGoal}><Hex/><span className="tag"><span className="name">Your goal</span><span className="count">Edit your search</span></span></button>
          {items.map((resource,i) => <ResourceNode key={resource.id} resource={resource} at={place(slots[i],viewport)} onOpen={() => setPanel(resource.id)}/>)}
          <button className="node end" data-side={goal.side} style={{transform:`translate(${goal.x}px,${goal.y}px)`,'--d':'76px'}} onClick={() => browse(true)}><Hex/><span className="tag"><span className="name">Your next steps</span><span className="count">Review saved resources</span></span></button>
        </>}
        <div className="strip"><h2 className="cap">From GT Engage and the campus calendar</h2>
          {eventError ? <p className="error">{eventError}</p> : <ol>{(eventData?.items || []).slice(0,2).map(event => <li key={event.url}><b>{new Date(event.starts_at).toLocaleDateString('en-US',{timeZone:'America/New_York',month:'short',day:'numeric'})}</b><div><a href={event.url} target="_blank" rel="noreferrer">{event.title} ↗</a></div></li>)}</ol>}
          <p className="event-note">{eventData?.stale ? 'Snapshot needs refresh · ' : ''}Open the source for schedules and registration.</p><button className="pill" onClick={() => setPanel('events')}>View events</button>
        </div>
        <div className="graph-actions"><p>Explore a different goal or keep useful resources in your saved list.</p><button className="pill" onClick={toGoal}>Change goal</button></div>
      </section>}
      <aside className="panel" data-open={panel !== null} aria-hidden={panel === null} inert={panel === null} aria-label="Resource details">
        <button className="close cap" ref={closeButton} onClick={() => setPanel(null)}>Close</button>
        {panel === 'events' ? <><h2>Campus events</h2>{eventBusy && <p role="status">Loading events…</p>}{eventError && <p className="error" role="alert">{eventError}</p>}<button className="pill" disabled={eventBusy} onClick={loadEvents}>Reload snapshot</button><EventList data={eventData}/></>
        : active && <><p className="cap quiet">{active.kind}</p><h2>{active.name}</h2><p className="lede">{active.summary}</p>
          <a className="pill hot" href={active.url} target="_blank" rel="noreferrer">Open official resource ↗</a>
          <button className="pill" disabled={saving} onClick={() => toggleSaved(active)}>{saving ? 'Saving…' : active.saved ? 'Remove from saved' : 'Save resource'}</button>
          <p role="status" className="notice">{active.saved ? 'Saved to your private browser workspace.' : ''}</p>
          {error && <p className="error" role="alert">{error}</p>}
          <dl><dt>Access</dt><dd>{active.access}</dd><dt>Source</dt><dd><a href={active.source_url} target="_blank" rel="noreferrer">View source ↗</a></dd><dt>Catalog entry checked</dt><dd>{active.verified_on}</dd></dl>
          {active.topics?.length > 0 && <><h3>Topics in the description</h3><div className="topic-list">{active.topics.map(topic => <span key={topic}>{topic}</span>)}</div></>}
          {active.related_jobs?.length > 0 && <><h3>Related job topics</h3><p className="quiet">These matches compare published descriptions. They do not verify alumni attendance or establish that a course satisfies every job requirement.</p>
            {active.related_jobs.map(job => <article className="job-match" key={job.id}><h4><a href={job.url} target="_blank" rel="noreferrer">{job.title} ↗</a></h4>
              <p>{job.employer} · {job.location} · Checked {job.verified_on}</p><p><strong>Shared topics:</strong> {job.matched_topics.join(', ')}</p><p>{job.context}</p></article>)}
          </>}
          <p className="quiet">This is a campus resource, not a claim that participation causes a career outcome. Check the source for current dates and eligibility.</p></>}
      </aside>
    </main>
  </>
}

function ProfileField({label, value, onChange, type='text', ...rest}) {
  return <label className="profile-field"><span>{label}</span><input aria-label={label} type={type} value={value ?? ''} onChange={e => onChange(e.target.value)} {...rest}/></label>
}

function ProfileSelect({label, value, onChange, options}) {
  return <label className="profile-field"><span>{label}</span><select aria-label={label} value={value ?? ''} onChange={e => onChange(e.target.value)}>{options.map(([v,t]) => <option key={v} value={v}>{t}</option>)}</select></label>
}

function ProfileEntry({section, entry, onChange, resources, review=false}) {
  const field = (key, value) => onChange({...entry, [key]:value})
  const options = resources.filter(r => section === 'courses' ? r.kind === 'Course' : r.kind === 'VIP project')
  return <div className="profile-entry-fields">
    {section === 'contacts' ? <>
      <ProfileSelect label="Contact type" value={entry.kind || 'email'} onChange={v => field('kind',v)} options={['email','phone','portfolio','github','linkedin'].map(v => [v,v])}/>
      <ProfileField label="Contact value" value={entry.value} onChange={v => field('value',v)} maxLength={500}/>
    </> : section === 'experiences' ? <>
      <ProfileSelect label="Experience type" value={entry.kind || 'job'} onChange={v => field('kind',v)} options={['job','internship','research','vip','club','project','volunteering'].map(v => [v,v])}/>
      <ProfileField label="Role or project title" value={entry.title} onChange={v => field('title',v)} maxLength={200}/>
      <ProfileField label="Organization" value={entry.organization} onChange={v => field('organization',v)} maxLength={200}/>
      <div className="profile-columns"><ProfileField label="Start (YYYY or YYYY-MM)" value={entry.start} onChange={v => field('start',v)} maxLength={7}/>
      <ProfileField label="End (YYYY or YYYY-MM)" value={entry.end} onChange={v => field('end',v)} disabled={entry.ongoing} maxLength={7}/></div>
      <label className="profile-check"><input type="checkbox" checked={entry.ongoing || false} onChange={e => onChange({...entry, ongoing:e.target.checked, end:e.target.checked ? '' : entry.end})}/>I currently do this</label>
      <label className="profile-field"><span>Description</span><textarea aria-label="Description" value={entry.description || ''} onChange={e => field('description',e.target.value)} maxLength={4000}/></label>
    </> : <>
      <div className="profile-columns"><ProfileField label="Course code" value={entry.code} onChange={v => field('code',v)} maxLength={30}/>
      <ProfileField label="Course title" value={entry.title} onChange={v => field('title',v)} maxLength={200}/></div>
      <ProfileField label="Institution" value={entry.institution} onChange={v => field('institution',v)} maxLength={200}/>
      <div className="profile-columns"><ProfileField label="Term (for example Fall 2026)" value={entry.term} onChange={v => field('term',v)} maxLength={50}/>
      <ProfileSelect label="Course status" value={entry.status || 'unspecified'} onChange={v => field('status',v)} options={['unspecified','planned','in_progress','taken','completed'].map(v => [v,v==='completed' ? 'Completed (self-reported)' : v.replace('_',' ')])}/></div>
      <ProfileSelect label="Record type" value={entry.record_type || 'coursework'} onChange={v => field('record_type',v)} options={[["coursework","Coursework"],["transfer_credit","Transfer credit"],["exam_credit","Exam / AP credit"]]}/>
    </>}
    {section !== 'contacts' && <ProfileSelect label="Link a campus resource (optional; confirm the match)" value={entry.resource_id || ''} onChange={v => field('resource_id',v ? Number(v) : null)} options={[["",'No linked resource'], ...options.map(r => [r.id,r.name])]}/>}
    {!review && <label className="profile-check"><input type="checkbox" checked={entry.visible || false} onChange={e => field('visible',e.target.checked)}/>Show this entry when my profile is public</label>}
    {!review && <p className="quiet">{entry.source === 'resume' ? 'Imported from your resume' : entry.source === 'transcript' ? 'Imported from your transcript' : 'Entered manually'} · Self-reported</p>}
  </div>
}

function ProfileScreen({onBack,onCourses}) {

  }, [dirty])
  const run = async action => {setBusy(true);setError('');setNotice('');try {await action()} catch(e) {setError(e.message)} finally {setBusy(false)}}
  const auth = e => {e.preventDefault(); run(async () => {
    const data = await api.request('/auth/' + (register ? 'register' : 'login'), {method:'POST',body:JSON.stringify({email,password,...(register ? {name} : {})})})

  const upload = file => run(async () => {

    {loading ? <p role="status">Loading your profile…</p> : !record ? <section className="profile-card profile-auth"><h2>{register ? 'Create your account' : 'Sign in'}</h2>

        </fieldset></section>
        {['contacts','experiences'].map(section => <section className="profile-card" key={section}><h2>{section === 'contacts' ? 'Contact information' : 'Experiences'}</h2>
          <fieldset disabled={busy}>{profile[section].length === 0 && <p className="quiet">No entries yet. Add one below or import a resume suggestion.</p>}
          {profile[section].map((entry,index) => <article className="profile-entry" key={entry.id}>

            <button className="pill" onClick={() => change(section,profile[section].filter((_,i) => i!==index))}>Remove {section === 'courses' ? 'class' : section === 'contacts' ? 'contact' : 'experience'}</button>
          </article>)}<button className="pill" onClick={() => add(section)}>Add {section === 'courses' ? 'class' : section === 'contacts' ? 'contact' : 'experience'}</button></fieldset>
        </section>)}
        <section className="profile-card"><h2>Sharing</h2><fieldset disabled={busy}>

          <ProfileSelect label="City" value={profile.city_id || ''} onChange={v => setProfile(p => ({...p,city_id:v ? Number(v) : null,share_city:v ? p.share_city : false}))} options={[["","No city selected"], ...options.cities.map(c => [c.id,`${c.name}, ${c.region || c.country_code}`])]}/>

        <button className="pill hot" disabled={busy || !dirty} onClick={save}>Save profile</button>
      </div><div>

          <fieldset disabled={busy}><label className="profile-field"><span>Resume file</span><input ref={fileInput} type="file" accept=".pdf,.docx" onChange={e => {const file=e.target.files[0];e.target.value='';upload(file)}}/></label>
          <details><summary>Paste resume text instead</summary><label className="profile-field"><span>Resume text</span><textarea aria-label="Resume text" value={pasted} onChange={e => setPasted(e.target.value)} maxLength={50000}/></label>
          <button className="pill" disabled={pasted.trim().length < 20} onClick={() => run(async () => {openDraft(await api.request('/resumes/text',{method:'POST',body:JSON.stringify({text:pasted})}));setPasted('');await refreshExtras()})}>Parse pasted text</button></details></fieldset>
          {busy && <p role="status">Processing…</p>}<p className="quiet">Drafts expire after 24 hours. Importing or discarding a draft deletes its extracted text. Scanned PDFs need pasted text or manual entry.</p>

              <ProfileEntry section={candidate.section} entry={candidate.value} resources={options.resources} review onChange={value => setDraft(d => ({...d,candidates:d.candidates.map((c,i) => i===index ? {...c,value} : c)}))}/>}
            <details><summary>Source text</summary><pre>{candidate.evidence}</pre></details>
          </article>)}
          {dirty && <p>Save your profile edits before importing suggestions.</p>}
          <button className="pill hot" disabled={dirty || !Object.values(selected).some(Boolean)} onClick={() => run(async () => {
            const data = await api.request('/resumes/'+draft.id+'/import',{method:'POST',body:JSON.stringify({version:record.version,courses_version:record.courses_version,selections:draft.candidates.filter(c => selected[c.id]).map(c => ({id:c.id,value:c.value}))})})

        </section>
        <section className="profile-card"><details><summary>Delete my account and profile</summary><p>Deletes your profile, resume drafts, and account sessions. This cannot be undone. Your anonymous resource workspace is separate.</p>
          <ProfileField label="Type DELETE to confirm" value={deleteText} onChange={setDeleteText}/><button className="pill" disabled={busy || deleteText!=='DELETE'} onClick={() => run(async () => {await api.request('/me',{method:'DELETE'});setRecord(null);setProfile(null);setDraft(null);setDrafts([]);setDeleteText('');setPasted('');setNotice('Account and profile deleted.')})}>Delete account permanently</button></details></section>
      </div></div>
    </>}
  </main>
}

function CoursesScreen({onBack,onProfile}) {
  const [collection,setCollection] = useState(null), [loading,setLoading] = useState(true), [needsLogin,setNeedsLogin] = useState(false)
  const [busy,setBusy] = useState(false), [error,setError] = useState(''), [notice,setNotice] = useState('')
  const [options,setOptions] = useState([]), [drafts,setDrafts] = useState([]), [draft,setDraft] = useState(null), [selected,setSelected] = useState({})
  const [editing,setEditing] = useState(null), [pasted,setPasted] = useState(''), [matches,setMatches] = useState(null)
  const [search,setSearch] = useState(''), [institution,setInstitution] = useState(''), [status,setStatus] = useState(''), [limit,setLimit] = useState(50)
  const run = async action => {setBusy(true);setError('');setNotice('');try {await action()} catch(e) {setError(e.message)} finally {setBusy(false)}}
  const extras = async () => {const [o,d,m] = await Promise.all([api.request('/profile-options'),api.request('/transcripts'),api.request('/me/matches')]);setOptions(o.resources);setDrafts(d.items);setMatches(m)}
  const load = async () => {setLoading(true);setError('');try {setCollection(await api.request('/me/courses'));setNeedsLogin(false);await extras()} catch(e) {if(e.status===401)setNeedsLogin(true);else setError(e.message)} finally {setLoading(false)}}
  useEffect(() => {load()},[])
  useEffect(() => {setLimit(50)},[search,institution,status])
  useEffect(() => {const warn=e=>{if(editing){e.preventDefault();e.returnValue=''}};window.addEventListener('beforeunload',warn);return()=>window.removeEventListener('beforeunload',warn)},[editing])
  const leave = target => {if(!editing || confirm('Leave without saving this course edit?')) target()}
  const openDraft = async id => {setDraft(await api.request('/transcripts/'+id));setSelected({})}
  const upload = file => run(async () => {
    if(!file)return
    if(!file.name.toLowerCase().endsWith('.pdf') || file.size>5*1024*1024)throw new Error('Choose a PDF up to 5 MB or paste transcript text.')
    const data=await api.request('/transcripts',{method:'POST',body:file,headers:{'Content-Type':'application/octet-stream'},timeout:45000})
    await openDraft(data.id);await extras();setNotice('Review every course against the original transcript before importing.')
  })
  const edit = row => {if(editing && !confirm('Discard the current course edit?'))return;setEditing({isNew:!row,course:row ? structuredClone(row) : {code:'',title:'',institution:'',term:'',status:'unspecified',record_type:'coursework',resource_id:null,visible:false},version:collection.version})}
  const saveCourse = () => run(async () => {setCollection(await api.request('/me/courses'+(editing.isNew ? '' : '/'+editing.course.id),{method:editing.isNew?'POST':'PUT',body:JSON.stringify({version:editing.version,course:editing.course})}));setEditing(null);await extras();setNotice('Course saved.')})
  const rows=collection?.items || []
  const filtered=rows.filter(c=>(!institution || c.institution===institution)&&(!status || c.status===status)&&[c.code,c.title,c.term,c.institution].join(' ').toLowerCase().includes(search.toLowerCase()))
    .sort((a,b)=>{const order=t=>{const y=Number(t.match(/\d{4}/)?.[0]||0);return y*10+(/fall/i.test(t)?4:/summer/i.test(t)?3:/spring/i.test(t)?2:1)};return order(b.term)-order(a.term)||a.code.localeCompare(b.code)})
  const groups=Object.groupBy(filtered.slice(0,limit),c=>c.term || 'Term not specified')
  return <main className="profile-page courses-page">

    <div className="profile-intro"><p className="cap quiet">Your academic journey</p><h1>My Courses</h1><p>Keep your course history in one place. Import a transcript or add courses yourself. Grades and GPA are not used.</p></div>
    {error && <p className="profile-message error" role="alert">{error}</p>}{notice && <p className="profile-message" role="status">{notice}</p>}
    {loading ? <p role="status">Loading courses…</p> : needsLogin ? <section className="profile-card"><h2>Sign in to manage courses</h2><p>Use your WarmPath account to keep courses and transcript drafts private.</p><button className="pill hot" onClick={onProfile}>Sign in or create an account</button></section> : !collection ? <button className="pill" onClick={load}>Retry loading courses</button> : <>
      <div className="profile-actions"><span>{collection.total} saved course entries · Private unless you choose to share</span><button className="pill hot" disabled={busy} onClick={()=>edit(null)}>Add course</button><button className="pill" disabled={busy} onClick={()=>{if(editing&&!confirm('Reload and discard your course edit?'))return;setEditing(null);load()}}>Reload courses</button></div>
      <div className="profile-layout"><div>
        {editing && <section className="profile-card course-editor"><h2>{editing.isNew?'Add a course':'Edit course'}</h2><fieldset disabled={busy}><ProfileEntry section="courses" entry={editing.course} resources={options} onChange={course=>setEditing(e=>({...e,course}))}/><button className="pill hot" onClick={saveCourse}>Save course</button><button className="pill" onClick={()=>setEditing(null)}>Cancel edit</button></fieldset></section>}
        <section className="profile-card"><h2>Course history</h2>
          <ProfileField label="Search courses" value={search} onChange={setSearch} placeholder="Code, title, institution or term"/>
          <div className="profile-columns"><ProfileSelect label="Filter by institution" value={institution} onChange={setInstitution} options={[["","All institutions"],...[...new Set(rows.map(c=>c.institution).filter(Boolean))].sort().map(i=>[i,i])]}/><ProfileSelect label="Filter by status" value={status} onChange={setStatus} options={[["","All statuses"],...['unspecified','planned','in_progress','taken','completed'].map(s=>[s,s.replace('_',' ')])]}/></div>
          <p className="quiet">Showing {Math.min(limit,filtered.length)} of {filtered.length} matching entries. Listed courses do not establish passing or prerequisite completion.</p>
          {!filtered.length && <p>{rows.length?'No courses match these filters.':'No courses yet. Add a course or import a transcript.'}</p>}
          {Object.entries(groups).map(([term,items])=><section key={term} className="course-term"><h3>{term}</h3>{items.map(c=><article className="profile-entry course-card" key={c.id}><h4>{c.code || 'Uncoded course'}{c.title && ' · '+c.title}</h4><p>{c.institution || 'Institution not specified'} · {c.status.replace('_',' ')} · {c.record_type.replace('_',' ')}</p><p className="quiet">{c.source==='transcript'?'Transcript import':c.source==='resume'?'Resume import':'Manual entry'} · {c.visible?'Shared when your profile is public':'Private'}</p><button className="pill" disabled={busy} onClick={()=>edit(c)}>Edit {c.code || c.title}</button><button className="pill" disabled={busy} onClick={()=>{if(confirm('Remove this course entry?'))run(async()=>{setCollection(await api.request('/me/courses/'+c.id+'?version='+collection.version,{method:'DELETE'}));if(editing?.course.id===c.id)setEditing(null);await extras();setNotice('Course removed.')})}}>Remove {c.code || c.title}</button></article>)}</section>)}
          {filtered.length>limit && <button className="pill" onClick={()=>setLimit(n=>n+50)}>Show 50 more</button>}
        </section>
      </div><div>
        <section className="profile-card"><h2>Import a transcript</h2><p>Upload a text-based PDF (up to 5 MB and 20 pages) or paste transcript text. Review the course list before importing. Scanned PDFs need pasted text or manual entry.</p>
          <fieldset disabled={busy}><label className="profile-field"><span>Transcript PDF</span><input aria-label="Transcript PDF" type="file" accept=".pdf" onChange={e=>{const file=e.target.files[0];e.target.value='';upload(file)}}/></label>
          <details><summary>Paste transcript text instead</summary><label className="profile-field"><span>Transcript text</span><textarea aria-label="Transcript text" value={pasted} onChange={e=>setPasted(e.target.value)} maxLength={50000}/></label><button className="pill" disabled={pasted.trim().length<20} onClick={()=>run(async()=>{const data=await api.request('/transcripts/text',{method:'POST',body:JSON.stringify({text:pasted})});setPasted('');await openDraft(data.id);await extras()})}>Parse transcript text</button></details></fieldset>
          {busy && <p role="status">Processing…</p>}<p className="quiet">Only course suggestions are retained for review. Raw files, raw transcript text, grades and GPA are not saved in transcript drafts. Drafts expire after 24 hours or are deleted on import/discard.</p>
          {drafts.map(d=><div className="profile-draft-link" key={d.id}><button className="pill" disabled={busy} onClick={()=>run(()=>openDraft(d.id))}>Review transcript draft</button><span className="quiet">Expires {new Date(d.expires_at).toLocaleString()}</span><button className="pill" disabled={busy} onClick={()=>run(async()=>{await api.request('/transcripts/'+d.id,{method:'DELETE'});if(draft?.id===d.id)setDraft(null);await extras()})}>Discard transcript</button></div>)}
        </section>
        {draft && <section className="profile-card transcript-review"><h2>Review transcript courses</h2><p>{draft.row_count} course rows detected. Compare every page with the original; unfamiliar layouts may need manual entry.</p>{draft.warnings.map((w,i)=><p className="quiet" key={i}>{w}</p>)}
          <fieldset disabled={busy}><button className="pill" onClick={()=>setSelected(Object.fromEntries(draft.candidates.map(c=>[c.id,true])))}>Select all courses</button><button className="pill" onClick={()=>setSelected({})}>Clear selection</button>
          {!draft.candidates.length && <p>No course rows could be identified. Paste text in subject/code/title rows or add courses manually.</p>}
          {draft.candidates.map((c,index)=><article className="profile-entry transcript-candidate" key={c.id}>
            <label className="profile-check"><input type="checkbox" checked={!!selected[c.id]} onChange={e=>setSelected(s=>({...s,[c.id]:e.target.checked}))}/>Import {c.course.code || 'course'}</label>
            <p className="quiet">Page {c.location.page}, extracted line {c.location.line}</p>{c.warnings.map((w,i)=><p key={i} className="quiet">{w}</p>)}
            {c.possible_duplicates?.length>0 && <p className="course-warning">An existing entry may match. Matching institution/course/term entries will be skipped, preserving your edits. Missing details need review.</p>}
            <ProfileEntry section="courses" entry={c.course} resources={options} review onChange={course=>setDraft(d=>({...d,candidates:d.candidates.map((r,i)=>i===index?{...r,course}:r)}))}/>
            <label className="profile-check"><input type="checkbox" checked={!!c.confirm_separate} onChange={e=>{const checked=e.target.checked;setDraft(d=>({...d,candidates:d.candidates.map((r,i)=>i===index?{...r,confirm_separate:checked}:r)}))}}/>Keep a separate entry if institution or term is missing and a possible match exists</label>
          </article>)}
          {editing && <p>Save or cancel your course edit before importing.</p>}
          <button className="pill hot" disabled={!!editing || !Object.values(selected).some(Boolean)} onClick={()=>run(async()=>{const result=await api.request('/transcripts/'+draft.id+'/import',{method:'POST',body:JSON.stringify({version:collection.version,selections:draft.candidates.filter(c=>selected[c.id]).map(c=>({id:c.id,course:c.course,confirm_separate:!!c.confirm_separate}))})});setCollection(result);setDraft(null);await extras();setNotice(`Courses imported. ${result.duplicates_skipped} duplicates skipped; existing entries preserved.`)})}>Import selected courses</button></fieldset>
        </section>}
        <section className="profile-card"><h2>Related job topics</h2><p>Link courses to catalog entries to compare published topics. These matches do not establish your skills or eligibility.</p>{matches?.items.length?matches.items.map(j=><article className="profile-entry" key={j.id}><a href={j.url} target="_blank" rel="noreferrer">{j.title} ↗</a><p>{j.matched_topics.join(', ')}</p></article>):<p className="quiet">No matches from saved catalog links yet.</p>}</section>
      </div></div>
    </>}
  </main>
}

function MapRoute() {
  return <main className="profile-page">
    <header className="profile-header"><a className="mark" href="./index.html"><i/>WarmPath</a><nav aria-label="WarmPath sections">
      <a className="pill" href="./index.html#/discovery">Discovery</a><a className="pill" href="./community.html">Social Jackets</a><a className="pill" href="./index.html#/profile">My Profile</a>
    </nav></header>
    <div className="profile-intro"><p className="cap quiet">Places, not path stops</p><h1>Maps</h1><p>Campus activities and alumni cities will use the same sourced event, location, and public profile records as the rest of WarmPath.</p></div>
    <section className="profile-card"><h2>Geographic maps are not available yet</h2><p>This route is ready for the campus and alumni-city map work. It is not showing sample pins or invented locations.</p><p className="quiet">Public event listings remain available through Social Jackets and resource discovery.</p><a className="pill hot" href="./community.html">Open Social Jackets</a> <a className="pill" href="./index.html#/discovery">Browse resources</a></section>
  </main>
}

function App() {
  const [page,setPage] = useState(location.hash.slice(2))
  useEffect(()=>{if(page==='community')location.replace(new URL('./community.html',location.href).href)},[page])
  useEffect(()=>{const changed=()=>setPage(location.hash.slice(2));window.addEventListener('hashchange',changed);return()=>window.removeEventListener('hashchange',changed)},[])
  const navigate = name => {location.hash=name?'#/'+name:'';setPage(name)}
  const [session, setSession] = useState(null), [error, setError] = useState('')
  const load = async () => { setError(''); try { setSession(await api.session()) } catch(e) { setError(e.message) } }
  useEffect(() => { load() }, [])
  if (location.hash.startsWith('#/reply/')) return <main className="boot"><h1>This prototype reply is unavailable</h1><p>Old prototype asks are not real outreach. No alumni-history dataset or recipient accounts are connected.</p><a href="/thermal/">Explore campus resources</a></main>
  if (page === 'map') return <MapRoute />
  if (!session) return <main className="boot"><h1>WarmPath</h1><p role={error ? 'alert' : 'status'}>{error || 'Connecting to your campus workspace…'}</p>{error && <><p>Please use the WarmPath website address provided by your team. If the service is unavailable, try again shortly.</p><button className="pill" onClick={load}>Retry connection</button></>}</main>
  if(page==='profile') return <ProfileScreen onBack={()=>navigate('')} onCourses={()=>navigate('courses')}/>
  if(page==='courses') return <CoursesScreen onBack={()=>navigate('')} onProfile={()=>navigate('profile')}/>
  return <Experience key={page || 'home'} initialRoute={page} session={session} onProfile={()=>navigate('profile')} onCourses={()=>navigate('courses')}/>
}

createRoot(document.getElementById('root')).render(<App />)
</script>
</body>
</html>
