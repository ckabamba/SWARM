<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WarmPath · Transit prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
  :root {
    --yellow: #f5b700;
    --yellow-deep: #dfa400;
    --ink: #0b1626;
    --ink-soft: rgba(11, 22, 38, 0.66);
    --ink-faint: rgba(11, 22, 38, 0.2);
    --paper: #ffffff;
    --cobalt: #1438f5;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
    --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--yellow);
    color: var(--ink);
    font-family: 'Archivo', system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
  }
  ::selection { background: var(--ink); color: var(--yellow); }
  button, input, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 4px solid var(--cobalt); outline-offset: 3px; }
  .hide { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

  /* signage caps */
  .cap { font-size: 12px; font-weight: 700; font-stretch: 100%; letter-spacing: 0.12em; text-transform: uppercase; }

  /* ---------- bar ---------- */
  .bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    height: 84px; padding: 0 40px;
  }
  .mark { justify-self: start; display: flex; align-items: center; gap: 12px; padding: 0; border: 0; background: none; font-size: 19px; font-weight: 800; font-stretch: 112%; letter-spacing: -0.01em; }
  .mark i { width: 22px; height: 22px; border-radius: 50%; border: 6px solid var(--ink); background: var(--paper); }
  .dest {
    display: flex; align-items: baseline; gap: 12px;
    padding: 9px 18px; border: 0; border-radius: 8px; background: var(--ink); color: var(--yellow);
    font-weight: 700; font-stretch: 92%; font-size: 17px;
    opacity: 0; transform: translateY(-8px); pointer-events: none;
    transition: opacity 240ms ease, transform 240ms var(--ease-out);
  }
  .dest span { color: var(--paper); opacity: 0.7; }
  [data-view='map'] .dest { opacity: 1; transform: none; pointer-events: auto; transition-delay: 500ms; }
  .dest:active { transform: scale(0.97); }
  .switch { justify-self: end; position: relative; display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border: 3px solid var(--ink); border-radius: 999px; }
  .switch button { position: relative; z-index: 1; padding: 8px 18px; border: 0; border-radius: 999px; background: none; white-space: nowrap; transition: color 200ms ease; }
  .switch button[aria-pressed='true'] { color: var(--yellow); }
  .switch .thumb { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); border-radius: 999px; background: var(--ink); transition: transform 300ms var(--ease-in-out); }
  .switch[data-index='1'] .thumb { transform: translateX(100%); }

  /* ---------- goal ---------- */
  .goal {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; justify-content: center;
    padding: 84px 7vw 0;
    transition: opacity 240ms ease, transform 320ms var(--ease-out);
  }
  [data-view='map'] .goal, [data-view='reply'] .goal { opacity: 0; transform: translateY(-28px); pointer-events: none; }
  .goal h1 {
    margin: 0 0 4vh;
    font-size: clamp(60px, 8.6vw, 124px);
    font-weight: 800; font-stretch: 125%;
    letter-spacing: -0.035em; line-height: 0.95;
  }
  .track { position: relative; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 0; }
  .track::before { content: ''; position: absolute; left: 40px; right: 40px; top: 50%; height: 12px; margin-top: -6px; background: var(--ink); }
  .roundel {
    position: relative; z-index: 1;
    display: grid; place-items: center;
    width: 84px; height: 84px; border-radius: 50%;
    border: 10px solid var(--ink); background: var(--paper);
    font-size: 13px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase;
  }
  .go { padding: 0; background: var(--ink); color: var(--yellow); transition: transform 160ms var(--ease-out), background-color 200ms ease; }
  .go svg { width: 30px; height: 30px; transition: transform 240ms var(--ease-out); }
  .go:active { transform: scale(0.95); }
  @media (hover: hover) and (pointer: fine) { .go:hover svg { transform: translateX(4px); } }
  .plate {
    position: relative; z-index: 1;
    margin: 0 26px; padding: 0 28px; height: 88px; min-width: 0; width: auto;
    border: 6px solid var(--ink); border-radius: 12px; background: var(--paper);
    font-size: clamp(26px, 3.1vw, 44px); font-weight: 700; font-stretch: 92%; letter-spacing: -0.015em;
    caret-color: var(--cobalt);
  }
  .plate::placeholder { color: rgba(11, 22, 38, 0.62); font-weight: 500; }
  .plate:focus { outline: 0; border-color: var(--cobalt); }
  .try { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 22px; margin: 30px 0 0 110px; font-size: 16px; font-weight: 500; }
  .try span { color: var(--ink-soft); }
  .try button { padding: 2px 0; border: 0; border-bottom: 2px solid var(--ink); background: none; font-weight: 600; }
  .try button { transition: background-color 160ms ease, color 160ms ease; }
  @media (hover: hover) and (pointer: fine) { .try button:hover { background: var(--ink); color: var(--yellow); } }
  .note { position: fixed; left: 40px; bottom: 30px; margin: 0; color: var(--ink-soft); }

  /* ---------- map ---------- */
  .map {
    position: fixed; inset: 84px 0 0;
    display: grid; grid-template-rows: minmax(0, 1fr) auto;
    padding: 0 40px 26px;
    opacity: 0; pointer-events: none;
    transition: opacity 200ms ease;
  }
  [data-view='map'] .map { opacity: 1; pointer-events: auto; }
  .net { width: 100%; height: 100%; min-height: 0; overflow: visible; }
  .net text { font-family: 'Archivo', system-ui, sans-serif; fill: var(--ink); }
  .zone line { stroke: var(--ink-faint); stroke-width: 2; stroke-dasharray: 2 9; stroke-linecap: round; }
  .zone text { font-size: 12px; font-weight: 700; letter-spacing: 0.14em; fill: var(--ink-soft); }
  .line { fill: none; stroke: var(--ink); stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
  .ahead { fill: none; stroke: var(--cobalt); stroke-width: 10; stroke-linecap: round; stroke-dasharray: 0.1 17; animation: march 800ms linear infinite; }
  @keyframes march { to { stroke-dashoffset: -17.1; } }
  .linetag rect { fill: var(--paper); stroke: var(--ink); stroke-width: 3; }
  .linetag text { font-size: 11px; font-weight: 800; letter-spacing: 0.12em; }
  .rider { fill: var(--paper); }

  .station { cursor: pointer; outline: none; }
  .station .dot { fill: var(--paper); stroke: var(--ink); stroke-width: 7; transition: fill 240ms ease, stroke 240ms ease; }
  .station .tick { fill: none; stroke: var(--yellow); stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transition: opacity 200ms ease; }
  .station.have .dot { fill: var(--ink); }
  .station.have .tick { opacity: 1; }
  .station.next .dot { stroke: var(--cobalt); }
  .station .halo { fill: none; stroke: var(--cobalt); stroke-width: 3; opacity: 0; transform-box: fill-box; transform-origin: center; }
  .station.next .halo { animation: halo 1900ms var(--ease-out) infinite; }
  @keyframes halo { from { opacity: 0.8; transform: scale(1); } to { opacity: 0; transform: scale(1.75); } }
  .station .grow { transform-box: fill-box; transform-origin: center; transition: transform 180ms var(--ease-out); }
  @media (hover: hover) and (pointer: fine) { .station:hover .grow { transform: scale(1.08); } }
  .station:active .grow { transform: scale(0.95); }
  .station:focus-visible .dot { stroke: var(--cobalt); stroke-width: 10; }
  .station .name { font-size: 19px; font-weight: 700; font-stretch: 88%; letter-spacing: -0.005em; }
  .station .count { font-size: 14.5px; font-weight: 500; fill: var(--ink-soft); }
  .station .count tspan { font-weight: 800; fill: var(--ink); }
  .badge rect { fill: var(--paper); }
  .badge .day { font-size: 11.5px; font-weight: 800; letter-spacing: 0.1em; }
  .badge .detail { font-size: 13.5px; font-weight: 600; opacity: 0; transition: opacity 240ms ease; }
  .station.next .badge .detail { opacity: 1; }
  .hub .disc { fill: var(--paper); stroke: var(--ink); stroke-width: 10; }
  .hub .in { font-size: 13px; font-weight: 800; letter-spacing: 0.1em; }
  .hub .who { font-size: 19px; font-weight: 700; font-stretch: 88%; }
  .hub .sub { font-size: 14.5px; font-weight: 500; fill: var(--ink-soft); }
  .terminus { cursor: pointer; outline: none; }
  .terminus .disc { fill: var(--ink); }
  .net .terminus .num { font-size: 34px; font-weight: 800; font-stretch: 118%; fill: var(--yellow); letter-spacing: -0.02em; }
  .terminus:focus-visible .disc { stroke: var(--cobalt); stroke-width: 6; }
  #flag { transition: transform 520ms var(--ease-in-out); }
  #flag rect { fill: var(--cobalt); }
  .net #flag text { fill: var(--paper); font-size: 11px; font-weight: 800; letter-spacing: 0.12em; }

  .below { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr); gap: 48px; padding-top: 14px; }
  .below h2 { margin: 0 0 10px; }
  .week { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 4px solid var(--ink); }
  .week li { list-style: none; padding: 12px 18px 0 0; }
  .week li + li { padding-left: 18px; border-left: 2px solid var(--ink-faint); }
  .week, .near { margin: 0; padding: 0; }
  .week b { display: block; font-size: 21px; font-weight: 800; font-stretch: 112%; letter-spacing: -0.01em; }
  .week em { display: block; font-style: normal; font-weight: 700; font-stretch: 92%; }
  .week span { display: block; font-size: 14px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .near { border-top: 4px solid var(--ink); }
  .near li { list-style: none; }
  .near button { display: flex; justify-content: space-between; gap: 12px; width: 100%; padding: 8px 0; border: 0; border-bottom: 2px solid var(--ink-faint); background: none; text-align: left; font-weight: 700; font-stretch: 92%; }
  .near button span { font-weight: 500; color: var(--ink-soft); }
  @media (hover: hover) and (pointer: fine) { .near button:hover { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; } }

  /* ---------- people sheet ---------- */
  .sheet {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 6;
    width: min(460px, 94vw);
    display: flex; flex-direction: column;
    background: var(--paper);
    transform: translateX(100%);
    transition: transform 220ms var(--ease-out), box-shadow 220ms ease;
  }
  .sheet[data-open='true'] { transform: none; box-shadow: -24px 0 60px -30px rgba(11, 22, 38, 0.55); transition: transform 440ms var(--ease-drawer), box-shadow 440ms ease; }
  .sheet header { position: relative; padding: 30px 30px 24px; background: var(--ink); color: var(--paper); }
  .sheet h2 { margin: 0 44px 8px 0; color: var(--yellow); font-size: 30px; font-weight: 800; font-stretch: 108%; letter-spacing: -0.02em; line-height: 1.05; }
  .sheet header p { margin: 0; max-width: 34ch; font-size: 15px; opacity: 0.86; }
  .sheet .x { position: absolute; top: 26px; right: 24px; width: 40px; height: 40px; display: grid; place-items: center; border: 0; border-radius: 50%; background: none; color: var(--paper); transition: transform 160ms var(--ease-out), background-color 160ms ease; }
  .sheet .x svg { width: 18px; height: 18px; }
  .sheet .x:active { transform: scale(0.94); }
  @media (hover: hover) and (pointer: fine) { .sheet .x:hover { background: rgba(255, 255, 255, 0.14); } }
  .sheet .rows { flex: 1; overflow-y: auto; padding: 0 30px 30px; }
  .row { position: relative; padding: 20px 0; border-bottom: 2px solid var(--ink-faint); }
  .row h3 { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 0; font-size: 20px; font-weight: 800; font-stretch: 96%; }
  .row h3 span { font-size: 14px; font-weight: 500; color: var(--ink-soft); }
  .row .tie { margin: 6px 0 14px; max-width: 40ch; }
  .btn {
    padding: 10px 20px; border: 0; border-radius: 999px;
    background: var(--ink); color: var(--paper); font-weight: 700;
    transition: transform 160ms var(--ease-out), background-color 160ms ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn.go2 { background: var(--cobalt); }
  .btn.plain { background: none; color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
  .compose { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 240ms var(--ease-out); }
  .compose[data-open='true'] { grid-template-rows: 1fr; }
  .compose > div { overflow: hidden; }
  .compose textarea { width: 100%; min-height: 176px; padding: 14px 16px; border: 3px solid var(--ink); border-radius: 10px; font-size: 15px; line-height: 1.5; resize: vertical; caret-color: var(--cobalt); }
  .compose textarea:focus { outline: 0; border-color: var(--cobalt); }
  .compose .acts { display: flex; justify-content: space-between; margin-top: 12px; padding-bottom: 2px; }
  .sent { margin: 0; font-weight: 600; }
  .sent a { color: var(--cobalt); text-underline-offset: 4px; margin-left: 8px; }
  .stamp {
    display: inline-block; padding: 5px 12px; border: 3px solid var(--cobalt); border-radius: 6px;
    color: var(--cobalt); transform: rotate(-4deg);
    animation: stamp 260ms var(--ease-out) both;
  }
  @keyframes stamp { from { opacity: 0; transform: rotate(-4deg) scale(1.25); } }
  .sheet .more { margin: 16px 0 0; font-size: 14px; color: var(--ink-soft); }

  /* ---------- alum reply: a ticket ---------- */
  .reply { position: fixed; inset: 0; display: none; place-items: center; padding: 28px 18px; overflow-y: auto; }
  [data-view='reply'] .reply { display: grid; }
  [data-view='reply'] .bar, [data-view='reply'] .map, [data-view='reply'] .sheet { display: none; }
  .ticket { width: min(392px, 100%); background: var(--paper); border-radius: 18px; box-shadow: 0 30px 50px -28px rgba(11, 22, 38, 0.6); }
  .ticket .top { display: flex; justify-content: space-between; align-items: center; padding: 22px 24px 0; }
  .ticket .tag { padding: 5px 10px; border-radius: 6px; background: var(--ink); color: var(--yellow); }
  .ticket .body { padding: 22px 24px 26px; }
  .ticket h1 { margin: 4px 0 2px; font-size: 38px; font-weight: 800; font-stretch: 112%; letter-spacing: -0.03em; line-height: 1; }
  .ticket .sub { margin: 0 0 20px; color: var(--ink-soft); font-weight: 500; }
  .ticket dt { margin: 18px 0 5px; color: var(--ink-soft); }
  .ticket dd { margin: 0; }
  .ticket .tie { font-size: 18px; font-weight: 700; font-stretch: 94%; line-height: 1.3; }
  .ticket .msg { font-size: 15px; line-height: 1.55; }
  .perf { position: relative; height: 0; border-top: 3px dashed var(--ink-faint); }
  .perf::before, .perf::after { content: ''; position: absolute; top: -13px; width: 26px; height: 26px; border-radius: 50%; background: var(--yellow); }
  .perf::before { left: -13px; }
  .perf::after { right: -13px; }
  .stub { position: relative; padding: 24px; text-align: center; }
  .stub .btn { width: 100%; padding: 19px; font-size: 18px; font-weight: 800; border-radius: 12px; }
  .stub p { margin: 12px 0 0; font-size: 14px; color: var(--ink-soft); }
  .stub .stamp { font-size: 22px; padding: 10px 22px; border-width: 4px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: 120ms !important; transition-delay: 0ms !important; }
    .rider { display: none; }
    .goal, .dest { transform: none !important; }
  }
</style>
<script src="../shared/fake-api.js"></script>
</head>
<body data-view="goal">

<header class="bar">
  <button class="mark" id="home" aria-label="WarmPath, choose a new goal"><i></i>WarmPath</button>
  <button class="dest" id="dest"><b id="destLabel"></b><span class="cap">Change</span></button>
  <div class="switch cap" id="switch" role="group" aria-label="Student profile"><span class="thumb"></span></div>
</header>

<section class="goal" id="goalView">
  <h1>Where to?</h1>
  <form id="goalForm">
    <div class="track">
      <span class="roundel">You</span>
      <label class="hide" for="goal">Your goal</label>
      <input class="plate" id="goal" autocomplete="off" spellcheck="false" autofocus placeholder="SWE internship at NVIDIA">
      <button class="roundel go" aria-label="Draw the route">
        <svg viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 15h20M17 7l8 8-8 8"/></svg>
      </button>
    </div>
  </form>
  <p class="try" id="try"><span>Also seeded:</span></p>
  <p class="note cap">Seeded demo data · 300 alumni, none of them real</p>
</section>

<section class="map" id="mapView" aria-label="Path map">
  <svg class="net" id="net" viewBox="0 0 1200 640" role="group" aria-label="Route from you to the goal"></svg>
  <div class="below">
    <div>
      <h2 class="cap">This week on your path</h2>
      <ol class="week" id="week"></ol>
    </div>
    <div>
      <h2 class="cap">Closest starts to yours</h2>
      <ul class="near" id="near"></ul>
    </div>
  </div>
</section>

<aside class="sheet" id="sheet" data-open="false" aria-hidden="true">
  <header>
    <h2 id="sheetTitle"></h2>
    <p id="sheetLede"></p>
    <button class="x" id="sheetClose" aria-label="Close">
      <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M3 3l12 12M15 3L3 15"/></svg>
    </button>
  </header>
  <div class="rows" id="rows"></div>
</aside>

<main class="reply" id="replyView"></main>

<script>
(function () {
  'use strict'
  var api = window.WarmPathFake
  var REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches
  var $ = function (id) { return document.getElementById(id) }
  var esc = function (text) { return String(text).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c] }) }

  // ---- network geometry, in the SVG's 1200 x 640 space ----
  // Each activity type is a line; a stop sits on its line at its typical year.
  var TRACK = { club: 130, vip: 250, course: 370, lab: 494, internship: 250, job: 370 }
  var LINE_NAME = { club: 'Clubs', vip: 'VIP teams', course: 'Courses', lab: 'Labs', internship: 'Internships', job: 'Jobs' }
  var YEAR_X = { 1: 412, 2: 566, 3: 766, 4: 800 }
  var YOU = { x: 120, y: 310 }, GOAL = { x: 1070, y: 310 }, FAN = 170, MERGE = 1000

  var state = { studentId: 1, panel: null, composing: null, path: null }
  var students = api.getStudents()

  function linePoints(y, endX) {
    var d = Math.abs(y - YOU.y)
    var pts = [[YOU.x, YOU.y], [FAN, YOU.y], [FAN + d, y]]
    if (endX != null) { pts.push([endX, y]); return pts }
    pts.push([MERGE - d, y], [MERGE, GOAL.y], [GOAL.x, GOAL.y])
    return pts
  }
  function rounded(pts, r) {
    var d = 'M' + pts[0]
    for (var i = 1; i < pts.length - 1; i++) {
      var p = pts[i - 1], c = pts[i], n = pts[i + 1]
      var a = Math.hypot(c[0] - p[0], c[1] - p[1]), b = Math.hypot(n[0] - c[0], n[1] - c[1])
      var ra = Math.min(r, a / 2), rb = Math.min(r, b / 2)
      d += ' L' + (c[0] - (c[0] - p[0]) / a * ra) + ',' + (c[1] - (c[1] - p[1]) / a * ra) +
        ' Q' + c + ' ' + (c[0] + (n[0] - c[0]) / b * rb) + ',' + (c[1] + (n[1] - c[1]) / b * rb)
    }
    return d + ' L' + pts[pts.length - 1]
  }
  function radius(stop) { return 11 + stop.achievers * 1.5 }
  function spot(stop) { return { x: YEAR_X[stop.typical_year] || 700, y: TRACK[stop.type] } }

  // ---- build the static network once ----
  function buildNet(path) {
    var types = []
    path.stops.forEach(function (s) { if (types.indexOf(s.type) === -1) types.push(s.type) })
    var svg = ''

    svg += '<g class="zone">'
    Object.keys(YEAR_X).slice(0, 3).forEach(function (year) {
      svg += '<line x1="' + YEAR_X[year] + '" y1="62" x2="' + YEAR_X[year] + '" y2="618"/>' +
        '<text x="' + YEAR_X[year] + '" y="46" text-anchor="middle">YEAR ' + year + '</text>'
    })
    svg += '</g>'

    svg += '<g id="lines">'
    types.forEach(function (type) {
      svg += '<path class="line" data-type="' + type + '" d="' + rounded(linePoints(TRACK[type]), 26) + '"/>'
    })
    svg += '</g><path class="ahead" id="ahead" d=""/>'

    svg += '<g id="riders">'
    if (!REDUCED) types.forEach(function (type, t) {
      var most = Math.max.apply(null, path.stops.filter(function (s) { return s.type === type }).map(function (s) { return s.achievers }))
      for (var i = 0; i < most; i++) {
        var dur = 15 + ((i * 7 + t * 3) % 6)
        svg += '<circle class="rider" r="3"><animateMotion dur="' + dur + 's" begin="-' + ((i / most) * dur).toFixed(2) + 's" repeatCount="indefinite" path="' + rounded(linePoints(TRACK[type]), 26) + '"/></circle>'
      }
    })
    svg += '</g>'

    types.forEach(function (type) {
      var w = LINE_NAME[type].length * 8.6 + 22
      var d = Math.abs(TRACK[type] - YOU.y)
      var xs = [FAN + d].concat(path.stops.filter(function (s) { return s.type === type }).map(function (s) { return spot(s).x }).sort(function (a, b) { return a - b }), [MERGE - d])
      var at = 0, widest = 0
      for (var i = 1; i < xs.length; i++) if (xs[i] - xs[i - 1] > widest) { widest = xs[i] - xs[i - 1]; at = (xs[i] + xs[i - 1]) / 2 }
      svg += '<g class="linetag" transform="translate(' + at + ',' + TRACK[type] + ')">' +
        '<rect x="' + (-w / 2) + '" y="-12" width="' + w + '" height="24" rx="12"/>' +
        '<text text-anchor="middle" y="4">' + LINE_NAME[type].toUpperCase() + '</text></g>'
    })

    svg += '<g class="hub" transform="translate(' + YOU.x + ',' + YOU.y + ')">' +
      '<circle class="disc" r="34"/><text class="in" text-anchor="middle" y="5">YOU</text>' +
      '<text class="who" id="who" text-anchor="middle" y="72"></text><text class="sub" id="whoSub" text-anchor="middle" y="93"></text></g>'

    path.stops.forEach(function (stop) {
      var p = spot(stop), r = radius(stop), up = p.y < YOU.y
      var nameY = up ? -(r + 34) : r + 30, countY = up ? -(r + 13) : r + 51
      var day = stop.event ? api.eventDay(stop.event.starts_at) : null
      var badgeY = up ? r + 12 : r + 62
      svg += '<g class="station" data-id="' + stop.activity_id + '" tabindex="0" role="button" transform="translate(' + p.x + ',' + p.y + ')" ' +
        'aria-label="' + esc(stop.name) + ', ' + stop.achievers + ' of ' + path.goal.achievers + ' did this. Show the alumni.">' +
        '<circle class="halo" r="' + (r + 6) + '"/>' +
        '<g class="grow"><circle class="dot" r="' + r + '"/><path class="tick" d="M-7,0.5 l5,5 l9,-10.5"/></g>' +
        '<text class="name" text-anchor="middle" y="' + nameY + '">' + esc(stop.name) + '</text>' +
        '<text class="count" text-anchor="middle" y="' + countY + '"><tspan>' + stop.achievers + ' of ' + path.goal.achievers + '</tspan> did this</text>' +
        (day ? '<g class="badge" transform="translate(0,' + badgeY + ')"><rect x="-34" y="0" width="68" height="22" rx="5"/>' +
          '<text class="day" text-anchor="middle" y="15.5">' + day.weekday.toUpperCase() + ' ' + day.day + '</text>' +
          '<text class="detail" text-anchor="middle" y="42">' + esc(stop.event.title) + ' · ' + day.time + ' · ' + esc(stop.event.location) + '</text></g>' : '') +
        '</g>'
    })

    svg += '<g class="terminus" id="terminus" tabindex="0" role="button" transform="translate(' + GOAL.x + ',' + GOAL.y + ')" aria-label="' + esc(path.goal.label) + '. Show the alumni who got here.">' +
      '<g class="grow"><circle class="disc" r="46"/><text class="num" text-anchor="middle" y="12">' + path.goal.achievers + '</text></g>' +
      '<text class="name" text-anchor="middle" y="84" style="font-size:19px;font-weight:700;font-stretch:88%">' + esc(path.goal.label) + '</text>' +
      '<text class="count" text-anchor="middle" y="105" style="font-size:14.5px;font-weight:500;fill:var(--ink-soft)">' + path.goal.achievers + ' alumni got here</text></g>'

    svg += '<g id="flag"><rect x="-49" y="-13" width="98" height="26" rx="13"/><text text-anchor="middle" y="4.5">NEXT STOP</text></g>'
    $('net').innerHTML = svg
  }

  // ---- what changes per student ----
  function applyStudent(animate) {
    var path = state.path = api.postPath({ goal: $('goal').value, student_id: state.studentId })
    var student = path.student
    $('switch').dataset.index = students.findIndex(function (s) { return s.id === state.studentId })
    Array.prototype.forEach.call($('switch').querySelectorAll('button'), function (b) { b.setAttribute('aria-pressed', String(Number(b.dataset.id) === state.studentId)) })
    $('destLabel').textContent = path.goal.label
    $('who').textContent = student.name
    $('whoSub').textContent = student.major + ' · Year ' + student.school_year

    var next = null
    path.stops.forEach(function (stop) {
      var g = $('net').querySelector('.station[data-id="' + stop.activity_id + '"]')
      g.classList.toggle('have', stop.have)
      g.classList.toggle('next', stop.next)
      if (stop.next) next = stop
    })

    // The dotted cobalt run: from the last stop you have on that line (or from You) to the next stop.
    var ahead = $('ahead'), flag = $('flag')
    if (next) {
      var p = spot(next), r = radius(next), up = p.y < YOU.y
      var behind = path.stops.filter(function (s) { return s.have && s.type === next.type && spot(s).x < p.x })
        .sort(function (a, b) { return spot(b).x - spot(a).x })[0]
      ahead.setAttribute('d', behind ? 'M' + spot(behind).x + ',' + p.y + ' L' + p.x + ',' + p.y : rounded(linePoints(p.y, p.x), 26))
      flag.style.transform = 'translate(' + p.x + 'px,' + (p.y - (up ? r + 68 : r + 24)) + 'px)'
      flag.style.opacity = 1
    } else {
      ahead.setAttribute('d', '')
      flag.style.opacity = 0
    }

    $('week').innerHTML = path.events.slice(0, 3).map(function (event) {
      var day = api.eventDay(event.starts_at)
      var stop = path.stops.filter(function (s) { return s.activity_id === event.activity_id })[0]
      return '<li><b>' + day.weekday + ' ' + day.day + '</b><em>' + esc(event.title) + '</em><span>' + esc(stop.name) + ' · ' + day.time + ' · ' + esc(event.location) + '</span></li>'
    }).join('')
    $('near').innerHTML = api.getPeople({ goal_id: path.goal.id, student_id: state.studentId }).slice(0, 3).map(function (person) {
      return '<li><button data-open="goal">' + esc(person.name) + '<span>' + person.major + ' ’' + String(person.grad_year).slice(2) + '</span></button></li>'
    }).join('')
    renderSheet()
  }

  // ---- the one authored moment: the network draws itself from You outward ----
  function drawOn() {
    if (REDUCED) return
    var ease = 'cubic-bezier(0.77, 0, 0.175, 1)', out = 'cubic-bezier(0.23, 1, 0.32, 1)'
    var span = GOAL.x - YOU.x
    Array.prototype.forEach.call($('net').querySelectorAll('.line'), function (line, i) {
      var len = line.getTotalLength()
      line.style.strokeDasharray = len
      line.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }], { duration: 1150, delay: 180 + i * 70, easing: ease, fill: 'backwards' })
        .finished.then(function () { line.style.strokeDasharray = '' })
    })
    var arrive = function (x) { return 180 + ((x - YOU.x) / span) * 1150 }
    Array.prototype.forEach.call($('net').querySelectorAll('.station'), function (g) {
      var stop = state.path.stops.filter(function (s) { return String(s.activity_id) === g.dataset.id })[0]
      var at = arrive(spot(stop).x) + 120
      g.querySelector('.grow').animate([{ opacity: 0, transform: 'scale(0.82)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 420, delay: at, easing: out, fill: 'backwards' })
      Array.prototype.forEach.call(g.querySelectorAll('.name, .count, .badge'), function (el, k) {
        el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 360, delay: at + 120 + k * 50, easing: 'ease', fill: 'backwards' })
      })
    })
    $('terminus').animate([{ opacity: 0 }, { opacity: 1 }], { duration: 420, delay: arrive(GOAL.x) + 60, easing: 'ease', fill: 'backwards' })
    var late = [$('flag'), $('ahead'), $('riders'), document.querySelector('.below')]
    late.forEach(function (el, k) {
      el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 420, delay: 1600 + k * 90, easing: 'ease', fill: 'backwards' })
    })
    Array.prototype.forEach.call($('net').querySelectorAll('.zone, .linetag, .hub'), function (el) {
      el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 420, delay: 60, easing: 'ease', fill: 'backwards' })
    })
  }

  // ---- people sheet ----
  function renderSheet() {
    var sheet = $('sheet'), open = state.panel !== null
    sheet.dataset.open = String(open)
    sheet.setAttribute('aria-hidden', String(!open))
    sheet.inert = !open
    if (!open) return
    var path = state.path
    var stop = path.stops.filter(function (s) { return s.activity_id === state.panel })[0]
    var people = api.getPeople({ goal_id: path.goal.id, student_id: state.studentId, activity_id: stop ? stop.activity_id : undefined })
    var asks = api.asksByAlum(state.studentId)
    var total = stop ? stop.achievers : path.goal.achievers
    var shown = people.slice(0, 4)
    $('sheetTitle').textContent = stop ? stop.name : path.goal.label
    $('sheetLede').textContent = (stop
      ? total + ' of the ' + path.goal.achievers + ' alumni who reached this goal went through here.'
      : total + ' alumni in the seed reached this goal.') + ' Closest starting point to yours first.'
    $('rows').innerHTML = shown.map(function (person) {
      var ask = asks[person.id], first = person.name.split(' ')[0], composing = state.composing === person.id
      var action = ask
        ? (ask.status === 'accepted'
            ? '<p class="sent"><span class="stamp cap">Accepted · 15-minute call</span></p>'
            : '<p class="sent">Sent. Waiting for ' + esc(first) + '.<a href="#/reply/' + ask.id + '" target="_blank" rel="noreferrer">Open the reply page</a></p>')
        : (composing ? '' : '<button class="btn" data-ask="' + person.id + '">Ask ' + esc(first) + '</button>')
      return '<article class="row"><h3>' + esc(person.name) + '<span>' + person.major + ' ’' + String(person.grad_year).slice(2) + '</span></h3>' +
        '<p class="tie">' + esc(person.shared_tie) + '</p>' + action +
        '<div class="compose" data-open="' + (composing && !ask) + '"><div>' +
        '<textarea aria-label="Message to ' + esc(person.name) + '" data-draft="' + person.id + '">' + esc(person.draft) + '</textarea>' +
        '<div class="acts"><button class="btn plain" data-cancel>Cancel</button><button class="btn go2" data-send="' + person.id + '">Send the ask</button></div>' +
        '</div></div></article>'
    }).join('') + (total > shown.length ? '<p class="more">Showing the ' + shown.length + ' closest of ' + total + '.</p>' : '')
  }

  // ---- alum reply page ----
  function renderReply(id) {
    var ask = api.getAsk(id), first = ask.student.name.split(' ')[0], accepted = ask.status === 'accepted'
    $('replyView').innerHTML =
      '<article class="ticket"><div class="top"><span class="mark"><i></i>WarmPath</span><span class="tag cap">15-minute call</span></div>' +
      '<div class="body"><dl><dt class="cap">From</dt><dd><h1>' + esc(ask.student.name) + '</h1><p class="sub">' + ask.student.major + ' · Year ' + ask.student.school_year + ' · Georgia Tech</p></dd>' +
      '<dt class="cap">What you share</dt><dd class="tie">' + esc(ask.shared_tie.replace('your next stop', first + '’s next stop')) + '</dd>' +
      '<dt class="cap">The ask</dt><dd class="msg">' + esc(ask.message) + '</dd></dl></div>' +
      '<div class="perf"></div><div class="stub">' +
      (accepted
        ? '<span class="stamp cap">Accepted</span><p>' + esc(first) + ' can see that you said yes.</p>'
        : '<button class="btn" data-accept="' + ask.id + '">Accept the call</button><p>One tap. No account needed.</p>') +
      '</div></article>'
  }

  // ---- wiring ----
  function route() {
    var reply = location.hash.match(/^#\/reply\/(\d+)/)
    if (reply) { document.body.dataset.view = 'reply'; renderReply(reply[1]) }
    else if (document.body.dataset.view === 'reply') document.body.dataset.view = 'goal'
  }
  function openPanel(id) { state.panel = id; state.composing = null; renderSheet() }

  $('switch').insertAdjacentHTML('beforeend', students.map(function (s) {
    return '<button data-id="' + s.id + '">' + s.major + ' · Year ' + s.school_year + '</button>'
  }).join(''))
  $('try').insertAdjacentHTML('beforeend', api.SEEDED_GOALS.slice(1).map(function (g) { return '<button type="button">' + esc(g) + '</button>' }).join(''))

  buildNet(api.postPath({ goal: '', student_id: state.studentId }))
  applyStudent()
  route()

  $('switch').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return
    state.studentId = Number(b.dataset.id); state.composing = null
    applyStudent()
  })
  $('try').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return
    $('goal').value = b.textContent; $('goal').focus()
  })
  $('goalForm').addEventListener('submit', function (e) {
    e.preventDefault()
    applyStudent()
    document.body.dataset.view = 'map'
    drawOn()
  })
  function home() { state.panel = null; renderSheet(); document.body.dataset.view = 'goal'; $('goal').focus() }
  $('home').addEventListener('click', home)
  $('dest').addEventListener('click', home)
  $('net').addEventListener('click', function (e) {
    var station = e.target.closest('.station')
    if (station) openPanel(Number(station.dataset.id))
    else if (e.target.closest('.terminus')) openPanel('goal')
  })
  $('net').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return
    var station = e.target.closest('.station')
    if (station || e.target.closest('.terminus')) { e.preventDefault(); openPanel(station ? Number(station.dataset.id) : 'goal') }
  })
  $('near').addEventListener('click', function (e) { if (e.target.closest('button')) openPanel('goal') })
  $('sheetClose').addEventListener('click', function () { state.panel = null; renderSheet() })
  window.addEventListener('keydown', function (e) { if (e.key === 'Escape' && state.panel !== null) { state.panel = null; renderSheet() } })
  $('rows').addEventListener('click', function (e) {
    var ask = e.target.closest('[data-ask]'), send = e.target.closest('[data-send]')
    if (ask) { state.composing = Number(ask.dataset.ask); renderSheet() }
    else if (e.target.closest('[data-cancel]')) { state.composing = null; renderSheet() }
    else if (send) {
      var id = Number(send.dataset.send)
      api.postAsk({ student_id: state.studentId, alum_id: id, goal_id: state.path.goal.id, message: $('rows').querySelector('[data-draft="' + id + '"]').value })
      state.composing = null
      renderSheet()
    }
  })
  $('replyView').addEventListener('click', function (e) {
    var accept = e.target.closest('[data-accept]')
    if (accept) { api.acceptAsk(accept.dataset.accept); renderReply(accept.dataset.accept) }
  })
  api.subscribe(function () {
    var reply = location.hash.match(/^#\/reply\/(\d+)/)
    if (reply) renderReply(reply[1]); else renderSheet()
  })
  window.addEventListener('hashchange', route)
})()
</script>
</body>
</html>
