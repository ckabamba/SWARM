# WarmPath demo origin: CloudFront (HTTPS) -> nginx :80 -> FastAPI on 127.0.0.1:8000.
#
# bootstrap.sh replaces __ORIGIN_SECRET__ with the value CloudFront sends as the
# X-Origin-Verify origin header. The secret is generated at deploy time and is never
# committed. Requests without it are refused, so another CloudFront distribution or a
# direct visitor cannot reach the app or forge X-Forwarded-For.

map $http_x_origin_verify $warmpath_from_cloudfront {
    default 0;
    "__ORIGIN_SECRET__" 1;
}

server {
    listen 80 default_server;
    server_name warmpath-origin;
    server_tokens off;

    # Resume and transcript uploads are limited to 5 MB by the API.
    client_max_body_size 6m;

    if ($warmpath_from_cloudfront = 0) {
        return 403;
    }

    # CloudFront appends the viewer address as the last X-Forwarded-For entry. Trusting
    # that entry is safe only because the shared-secret check above has already passed.
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        # CloudFront forwards the viewer Host; the API accepts only WARMPATH_PUBLIC_ORIGIN's host.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Origin-Verify "";
        proxy_read_timeout 60s;
    }
}
